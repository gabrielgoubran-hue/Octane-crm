<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octane CRM v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --oct:#e86510;--oct-l:#fff5ed;--oct-d:#c74d0a;
  --blue:#1565c0;--blue-l:#e3f2fd;
  --green:#16a34a;--green-l:#dcfce7;
  --red:#dc2626;--red-l:#fee;
  --bg:#f8f9fa;--surface:#fff;--surface2:#f5f5f5;
  --txt:#1a2332;--txt2:#64748b;--txt3:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;
  --r:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
.app{display:flex;height:100vh}
.sidebar{width:70px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:15px 0}
.logo{font-size:28px;margin-bottom:30px}
.nb{width:48px;height:48px;border:none;background:transparent;border-radius:12px;cursor:pointer;font-size:20px;margin-bottom:8px;transition:all .2s;position:relative;display:flex;align-items:center;justify-content:center}
.nb:hover{background:var(--oct-l)}
.nb.active{background:var(--oct);color:white}
.nb-sep{width:30px;height:1px;background:var(--border);margin:8px 0}
.content{flex:1;overflow-y:auto;padding:20px 30px}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;padding-bottom:15px;border-bottom:2px solid var(--oct)}
.ph-title{font-size:24px;font-weight:700;color:var(--txt)}
.ph-sub{font-size:13px;color:var(--txt2);margin-top:2px}
.ph-right{display:flex;gap:10px}
.btn{padding:10px 18px;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--oct);color:white}
.btn-primary:hover{background:var(--oct-d)}
.btn-secondary{background:var(--surface2);color:var(--txt)}
.btn-secondary:hover{background:var(--border2)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.stat{background:var(--surface);padding:15px;border-radius:var(--r);border:1px solid var(--border)}
.stat-lbl{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:28px;font-weight:700;color:var(--oct);margin-top:5px}
.stat-sub{font-size:11px;color:var(--txt3);margin-top:2px}
.fbar{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.fbar input{flex:1;min-width:250px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r);font-size:14px}
.fbar select{padding:10px 14px;border:1px solid var(--border);border-radius:var(--r);font-size:14px;background:white}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r);overflow:hidden}
.tbl thead{background:var(--surface2)}
.tbl th{text-align:left;padding:12px;font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border)}
.tbl td{padding:12px;border-bottom:1px solid var(--border)}
.tbl tbody tr{cursor:pointer;transition:background .2s}
.tbl tbody tr:hover{background:var(--oct-l)}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600}
.b-active{background:var(--green-l);color:var(--green)}
.b-inactive{background:var(--red-l);color:var(--red)}
.b-hitlist{background:#fef3c7;color:#d97706}
.expand-td{padding:0!important;background:var(--surface2)}
.expand-panel{padding:20px;border-top:1px solid var(--border)}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:15px}
.ep-field{margin-bottom:10px}
.ep-label{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.ep-val{font-size:14px;color:var(--txt)}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--surface);border-radius:12px;padding:25px;width:90%;max-width:700px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;color:var(--txt)}
.m-field{margin-bottom:15px}
.m-label{display:block;font-size:13px;font-weight:600;color:var(--txt);margin-bottom:5px}
.m-input,.m-select,.m-textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:14px;font-family:inherit}
.m-input:focus,.m-select:focus,.m-textarea:focus{outline:none;border-color:var(--oct)}
.m-textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.btn-cancel{flex:1;padding:12px;border:none;border-radius:var(--r);background:var(--surface2);color:var(--txt);font-weight:600;cursor:pointer}
.btn-confirm{flex:1;padding:12px;border:none;border-radius:var(--r);background:var(--oct);color:white;font-weight:600;cursor:pointer}
.btn-confirm:hover{background:var(--oct-d)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--txt);color:white;padding:12px 20px;border-radius:var(--r);opacity:0;transition:opacity .3s;z-index:2000}
.toast.show{opacity:1}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}
.section-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:15px}
.section-title{font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.required::after{content:' *';color:var(--red)}
.edit-btn{background:transparent;border:none;color:var(--oct);font-size:16px;cursor:pointer;padding:4px 8px}
.edit-btn:hover{background:var(--oct-l);border-radius:4px}
.empty{text-align:center;padding:40px;color:var(--txt3);font-style:italic}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:30px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover{border-color:var(--oct);background:var(--oct-l)}
.log-entry{padding:12px;border-bottom:1px solid var(--border);font-size:13px}
.log-time{color:var(--txt3);font-size:11px;margin-right:10px}
.log-user{color:var(--oct);font-weight:600;margin-right:5px}
.log-action{color:var(--txt2)}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="logo">⛽</div>
    <button class="nb active" id="nav-accounts" onclick="go('accounts')">📋</button>
    <button class="nb" id="nav-campaigns" onclick="go('campaigns')">📢</button>
    <button class="nb" id="nav-orders" onclick="go('orders')">📦</button>
    <button class="nb" id="nav-analysis" onclick="go('analysis')">📊</button>
    <button class="nb" id="nav-hitlist" onclick="go('hitlist')">🎯</button>
    <button class="nb" id="nav-logs" onclick="go('logs')">📜</button>
    <button class="nb" id="nav-import" onclick="go('import')">📥</button>
    <div class="nb-sep"></div>
    <button class="nb" onclick="exportData()">💾</button>
  </div>
  
  <div class="content" id="content"></div>
</div>

<div class="modal-bg" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modal-inner" onclick="event.stopPropagation()"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// STATE
const S = {
  page: 'accounts',
  customers: [],
  orders: [],
  users: [{id: 'admin', name: 'Admin User', team: 'admin'}],
  activityLogs: [],
  expandedId: null,
  expandedCampaign: null, // For campaign expand
  expandedOrder: null, // For order expand
  currentUser: {id: 'admin', name: 'Admin User'},
  // Sort states: {column: null, direction: 0/1/2} where 0=none, 1=asc, 2=desc
  accountsSort: {column: null, direction: 0},
  campaignsSort: {column: null, direction: 0},
  ordersSort: {column: null, direction: 0},
  analysisAgentsSort: {column: null, direction: 0},
  analysisTopSalesSort: {column: null, direction: 0},
  analysisTopOrdersSort: {column: null, direction: 0},
  analysisTopValueSort: {column: null, direction: 0},
  analysisTypeSort: {column: null, direction: 0},
  analysisCampaignsSort: {column: null, direction: 0},
  fSearch: '',
  fStatus: '',
  fFuelActivity: '',
  fOstoreActivity: '',
  fFuelAM: '',
  fOstoreAM: '',
  // Campaign filters
  cSearch: '',
  cType: '',
  cDateFrom: '',
  cDateTo: '',
  // Order filters
  oSearch: '',
  oDateFrom: '',
  oDateTo: '',
  oPaymentMethod: '',
  oProductBrand: '',
  oStatus: '',
  oProductType: '',
  oSalesPerson: '',
  oCampaignName: '',
  oCampaignType: ''
};

const STATUSES = ['Called','Answered','Not answered','Interested','Meeting scheduled','Meeting done','Offer sent','Offer accepted','Offer rejected'];

// INIT
function init() {
  loadData();
  render();
}

function loadData() {
  const saved = localStorage.getItem('octane_customers');
  if (saved) {
    S.customers = JSON.parse(saved);
    
    // Update last campaign for all customers (fixes old data)
    let needsUpdate = false;
    S.customers.forEach(c => {
      const oldCampaign = c.lastOutboundCampaign;
      updateLastCampaign(c);
      if (oldCampaign !== c.lastOutboundCampaign) needsUpdate = true;
    });
    
    // Save if any updates were made
    if (needsUpdate) {
      localStorage.setItem('octane_customers', JSON.stringify(S.customers));
    }
  }
  
  const savedOrders = localStorage.getItem('octane_orders');
  if (savedOrders) S.orders = JSON.parse(savedOrders);
  
  const savedLogs = localStorage.getItem('octane_logs');
  if (savedLogs) S.activityLogs = JSON.parse(savedLogs);
  
  const savedUsers = localStorage.getItem('octane_users');
  if (savedUsers) S.users = JSON.parse(savedUsers);
}

function saveData() {
  // Update last campaign for all customers before saving
  S.customers.forEach(c => {
    updateLastCampaign(c);
  });
  
  localStorage.setItem('octane_customers', JSON.stringify(S.customers));
  localStorage.setItem('octane_orders', JSON.stringify(S.orders));
  localStorage.setItem('octane_logs', JSON.stringify(S.activityLogs));
  localStorage.setItem('octane_users', JSON.stringify(S.users));
}

function updateLastCampaign(customer) {
  // Determine the most recent campaign
  let lastCampaign = '';
  let lastDate = null;
  
  // Check WhatsApp
  if (customer.whatsappCampaign) {
    const waDate = customer.whatsappCampaignDate ? new Date(customer.whatsappCampaignDate) : new Date(0);
    if (!lastDate || waDate > lastDate) {
      lastDate = waDate;
      lastCampaign = 'WhatsApp: ' + customer.whatsappCampaign;
    }
  }
  
  // Check Telesales
  if (customer.telesalesCampaign) {
    const tsDate = customer.telesalesCampaignDate ? new Date(customer.telesalesCampaignDate) : new Date(0);
    if (!lastDate || tsDate > lastDate) {
      lastDate = tsDate;
      lastCampaign = 'Telesales: ' + customer.telesalesCampaign;
    }
  }
  
  // Check Dashboard
  if (customer.dashboardCampaign) {
    const dbDate = customer.dashboardCampaignDate ? new Date(customer.dashboardCampaignDate) : new Date(0);
    if (!lastDate || dbDate > lastDate) {
      lastDate = dbDate;
      lastCampaign = 'Dashboard: ' + customer.dashboardCampaign;
    }
  }
  
  customer.lastOutboundCampaign = lastCampaign;
  if (lastDate && lastDate.getTime() > 0) {
    customer.lastOutboundEngagement = lastDate.toISOString();
  }
}

function logActivity(action, customerName) {
  S.activityLogs.unshift({
    timestamp: new Date().toISOString(),
    user: S.currentUser.name,
    action: action,
    customerName: customerName
  });
  // Keep only last 500 logs
  if (S.activityLogs.length > 500) S.activityLogs = S.activityLogs.slice(0, 500);
  saveData();
}

function go(page) {
  S.page = page;
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  if (document.getElementById('nav-' + page)) {
    document.getElementById('nav-' + page).classList.add('active');
  }
  render();
}

function render() {
  const el = document.getElementById('content');
  if (S.page === 'accounts') el.innerHTML = renderAccounts();
  else if (S.page === 'campaigns') el.innerHTML = renderCampaigns();
  else if (S.page === 'orders') el.innerHTML = renderOrders();
  else if (S.page === 'analysis') el.innerHTML = renderAnalysis();
  else if (S.page === 'hitlist') el.innerHTML = renderHitlist();
  else if (S.page === 'logs') el.innerHTML = renderLogs();
  else if (S.page === 'import') el.innerHTML = renderImport();
}

// ACCOUNTS PAGE
function renderAccounts() {
  let list = getVisible();
  
  // Calculate sales for each customer (needed for sorting)
  list = list.map(c => ({
    ...c,
    sales: S.orders.filter(o => o.customerId === c.id).reduce((sum, o) => sum + (parseFloat(o.sellingPrice) || 0), 0)
  }));
  
  // Apply sorting
  list = applySorting(list, 'accounts', ['companyName', 'city', 'fleetSize', 'sales']);
  
  const totalCustomers = S.customers.length;
  const activeCustomers = S.customers.filter(c => c.ostoreActive).length;
  const inactiveCustomers = totalCustomers - activeCustomers;
  const hitlistTotal = S.customers.filter(c => c.onHitlist).length;
  
  // Campaign stats
  const campaignOffers = S.customers.filter(c => 
    c.whatsappCampaign || c.telesalesCampaign || c.dashboardCampaign
  ).length;
  
  const leadsGenerated = S.customers.filter(c => 
    c.whatsappInterested === 'Interested' || 
    c.telesalesInterested === 'Interested' || 
    c.dashboardInterested === 'Interested'
  ).length;
  
  const convertedCustomers = S.customers.filter(c => 
    c.ostoreStatus === 'Offer accepted'
  ).length;
  
  const rows = list.map(c => {
    const isExp = S.expandedId === c.id;
    const lastCampaign = c.lastOutboundCampaign || '—';
    const interest = c.whatsappInterested || c.telesalesInterested || c.dashboardInterested || '—';
    
    // Calculate sales for this customer
    const customerOrders = S.orders.filter(o => o.customerId === c.id);
    const sales = customerOrders.reduce((sum, o) => sum + (parseFloat(o.sellingPrice) || 0), 0);
    
    let html = '<tr onclick="toggleExpand(\'' + c.id + '\')">';
    html += '<td><div style="font-weight:600;font-size:13px">' + c.companyName + '</div>';
    html += '<div style="font-size:11px;color:var(--txt3)">' + (c.primaryContactName || '') + '</div></td>';
    html += '<td style="font-size:12px;color:var(--txt2)">' + (c.city || '') + '</td>';
    html += '<td style="font-weight:600;color:var(--oct)">' + (c.fleetSize || 0) + '</td>';
    html += '<td style="font-weight:700;color:' + (sales > 0 ? 'var(--green)' : 'var(--txt3)') + '">$' + (sales > 0 ? sales.toLocaleString() : '0') + '</td>';
    html += '<td><span class="badge ' + (c.fuelActive ? 'b-active' : 'b-inactive') + '">' + (c.fuelActive ? 'Active' : 'Inactive') + '</span></td>';
    html += '<td><span class="badge ' + (c.ostoreActive ? 'b-active' : 'b-inactive') + '">' + (c.ostoreActive ? 'Active' : 'Inactive') + '</span></td>';
    html += '<td>' + (c.ostoreStatus ? '<span class="badge">' + c.ostoreStatus + '</span>' : '—') + '</td>';
    html += '<td>' + (c.onHitlist ? '<span class="badge b-hitlist">✓ Hitlist</span>' : '') + '</td>';
    html += '<td style="font-size:11px;color:var(--txt2)">' + lastCampaign + '</td>';
    html += '<td style="font-size:11px;color:var(--txt2)">' + interest + '</td>';
    html += '<td><button class="edit-btn" onclick="event.stopPropagation();openEdit(\'' + c.id + '\')">✏️</button></td>';
    html += '</tr>';
    
    if (isExp) {
      html += '<tr><td colspan="11" class="expand-td"><div class="expand-panel">' + renderExpand(c) + '</div></td></tr>';
    }
    
    return html;
  }).join('');
  
  // Calculate totals
  const totalSales = S.orders.reduce((sum, o) => sum + (parseFloat(o.sellingPrice) || 0), 0);
  
  let html = '<div>';
  html += '<div class="page-head">';
  html += '<div><div class="ph-title">Accounts</div><div class="ph-sub">' + list.length + ' customers</div></div>';
  html += '<div class="ph-right">';
  html += '<button class="btn btn-primary" onclick="openAdd()">+ Add Customer</button>';
  html += '</div></div>';
  
  html += '<div class="stat-row">';
  html += '<div class="stat"><div class="stat-lbl">Total Customers</div><div class="stat-val" style="color:var(--oct)">' + totalCustomers + '</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Active O-store</div><div class="stat-val" style="color:var(--green)">' + activeCustomers + '</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Inactive O-store</div><div class="stat-val" style="color:var(--red)">' + inactiveCustomers + '</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Hitlist Total</div><div class="stat-val" style="color:#d97706">' + hitlistTotal + '</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Campaign Offers</div><div class="stat-val" style="color:var(--blue)">' + campaignOffers + '</div><div class="stat-sub">Total sent</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Leads Generated</div><div class="stat-val" style="color:var(--green)">' + leadsGenerated + '</div><div class="stat-sub">From campaigns</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Converted</div><div class="stat-val" style="color:var(--oct)">' + convertedCustomers + '</div><div class="stat-sub">Offer accepted</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Total Sales</div><div class="stat-val" style="color:var(--green)">$' + totalSales.toLocaleString() + '</div><div class="stat-sub">All orders</div></div>';
  html += '</div>';
  
  html += '<div class="fbar">';
  html += '<input type="text" id="search-input" placeholder="Search company, contact, city, phone, customer ID, campaign…" value="' + S.fSearch + '" oninput="handleSearch(this.value)">';
  html += '<select onchange="S.fStatus=this.value;render()"><option value="">All statuses</option>';
  STATUSES.forEach(s => {
    html += '<option value="' + s + '"' + (S.fStatus === s ? ' selected' : '') + '>' + s + '</option>';
  });
  html += '</select>';
  html += '<select onchange="S.fFuelActivity=this.value;render()"><option value="">Fuel: All</option><option value="Active"' + (S.fFuelActivity === 'Active' ? ' selected' : '') + '>Fuel: Active</option><option value="Inactive"' + (S.fFuelActivity === 'Inactive' ? ' selected' : '') + '>Fuel: Inactive</option></select>';
  html += '<select onchange="S.fOstoreActivity=this.value;render()"><option value="">O-store: All</option><option value="Active"' + (S.fOstoreActivity === 'Active' ? ' selected' : '') + '>O-store: Active</option><option value="Inactive"' + (S.fOstoreActivity === 'Inactive' ? ' selected' : '') + '>O-store: Inactive</option></select>';
  
  // Get unique Fuel AMs
  const fuelAMs = [...new Set(S.customers.map(c => c.fuelAM).filter(Boolean))].sort();
  html += '<select onchange="S.fFuelAM=this.value;render()"><option value="">All Fuel AMs</option>';
  fuelAMs.forEach(am => {
    html += '<option value="' + am + '"' + (S.fFuelAM === am ? ' selected' : '') + '>' + am + '</option>';
  });
  html += '</select>';
  
  // Get unique O-store AMs
  const ostoreAMs = [...new Set(S.customers.map(c => c.ostoreAM).filter(Boolean))].sort();
  html += '<select onchange="S.fOstoreAM=this.value;render()"><option value="">All O-store AMs</option>';
  ostoreAMs.forEach(am => {
    html += '<option value="' + am + '"' + (S.fOstoreAM === am ? ' selected' : '') + '>' + am + '</option>';
  });
  html += '</select>';
  html += '</div>';
  
  html += '<div class="tbl-wrap"><table class="tbl">';
  html += '<thead><tr>';
  html += '<th onclick="sortTable(\'accounts\', \'companyName\')" style="cursor:pointer">Company' + getSortIndicator('accounts', 'companyName') + '</th>';
  html += '<th onclick="sortTable(\'accounts\', \'city\')" style="cursor:pointer">City' + getSortIndicator('accounts', 'city') + '</th>';
  html += '<th onclick="sortTable(\'accounts\', \'fleetSize\')" style="cursor:pointer">Fleet Size' + getSortIndicator('accounts', 'fleetSize') + '</th>';
  html += '<th onclick="sortTable(\'accounts\', \'sales\')" style="cursor:pointer">Sales' + getSortIndicator('accounts', 'sales') + '</th>';
  html += '<th>Fuel Activity</th>';
  html += '<th>O-store Activity</th>';
  html += '<th>Status</th>';
  html += '<th>Hitlist</th>';
  html += '<th>Last Campaign</th>';
  html += '<th>Interest</th>';
  html += '<th></th>';
  html += '</tr></thead>';
  html += '<tbody>' + (rows || '<tr><td colspan="11"><div class="empty">No customers found</div></td></tr>') + '</tbody>';
  html += '</table></div></div>';
  
  return html;
}

function renderExpand(c) {
  let html = '<div class="ep-grid">';
  html += '<div class="ep-field"><div class="ep-label">Customer ID</div><div class="ep-val" style="font-weight:600;color:var(--oct)">' + c.id + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Primary Contact</div><div class="ep-val">' + (c.primaryContactName || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Primary Phone</div><div class="ep-val">' + (c.primaryContactPhone || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Secondary Contact</div><div class="ep-val">' + (c.secondaryContactName || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Secondary Phone</div><div class="ep-val">' + (c.secondaryContactPhone || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Fleet Size</div><div class="ep-val">' + (c.fleetSize || 0) + ' vehicles</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Fuel AM</div><div class="ep-val">' + (c.fuelAM || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">O-store AM</div><div class="ep-val">' + (c.ostoreAM || '—') + '</div></div>';
  html += '</div>';
  
  // Order Summary
  const customerOrders = S.orders.filter(o => o.customerId === c.id);
  if (customerOrders.length > 0) {

    const sortedHistory = [...c.campaignHistory].sort((a, b) => 
      new Date(b.archivedAt) - new Date(a.archivedAt)
    );
    
    sortedHistory.forEach(campaign => {
      const typeColor = campaign.type === 'WhatsApp' ? '#0ea5e9' : 
                       campaign.type === 'Telesales' ? '#8b5cf6' : '#f59e0b';
      const interestColor = campaign.interested === 'Interested' ? 'var(--green)' : 
                           campaign.interested === 'Not Interested' ? 'var(--red)' : 
                           'var(--txt3)';
      
      html += '<div style="background:var(--surface2);padding:10px;margin-bottom:8px;border-radius:6px;border-left:3px solid ' + typeColor + '">';

      html += '<div style="font-weight:600;font-size:13px;color:' + typeColor + '">' + campaign.type + '</div>';
      html += '<div style="font-size:11px;color:var(--txt3)">' + convertToUS(campaign.date || '') + '</div>';
      html += '</div>';
      html += '<div style="font-size:13px;margin-bottom:4px">' + campaign.name + '</div>';
      html += '<div style="font-size:11px;color:' + interestColor + ';font-weight:600">' + (campaign.interested || 'No response') + '</div>';
      html += '</div>';
    });
    
    html += '</div></div>';
  }
  
  return html;
}

function getVisible() {
  let list = S.customers;
  
  // Enhanced search: Company, Contact, City, Phone, Customer ID, Campaign Name
  if (S.fSearch) {
    const q = S.fSearch.toLowerCase();
    list = list.filter(c => 
      c.companyName.toLowerCase().includes(q) ||
      (c.primaryContactName && c.primaryContactName.toLowerCase().includes(q)) ||
      (c.city && c.city.toLowerCase().includes(q)) ||
      (c.primaryContactPhone && c.primaryContactPhone.includes(q)) ||
      (c.id && c.id.toLowerCase().includes(q)) || // Customer ID
      (c.whatsappCampaign && c.whatsappCampaign.toLowerCase().includes(q)) || // Campaign names
      (c.telesalesCampaign && c.telesalesCampaign.toLowerCase().includes(q)) ||
      (c.dashboardCampaign && c.dashboardCampaign.toLowerCase().includes(q))
    );
  }
  
  // Filter by status
  if (S.fStatus) list = list.filter(c => c.ostoreStatus === S.fStatus);
  
  // Filter by Fuel Activity
  if (S.fFuelActivity === 'Active') list = list.filter(c => c.fuelActive === true);
  if (S.fFuelActivity === 'Inactive') list = list.filter(c => c.fuelActive === false);
  
  // Filter by O-store Activity
  if (S.fOstoreActivity === 'Active') list = list.filter(c => c.ostoreActive === true);
  if (S.fOstoreActivity === 'Inactive') list = list.filter(c => c.ostoreActive === false);
  
  // Filter by Fuel AM
  if (S.fFuelAM) list = list.filter(c => c.fuelAM === S.fFuelAM);
  
  // Filter by O-store AM
  if (S.fOstoreAM) list = list.filter(c => c.ostoreAM === S.fOstoreAM);
  
  return list;
}

// SORTING FUNCTIONS
function sortTable(tab, column) {
  let sortState;
  if (tab === 'accounts') sortState = S.accountsSort;
  else if (tab === 'campaigns') sortState = S.campaignsSort;
  else if (tab === 'orders') sortState = S.ordersSort;
  else if (tab === 'analysisAgents') sortState = S.analysisAgentsSort;
  else if (tab === 'analysisTopSales') sortState = S.analysisTopSalesSort;
  else if (tab === 'analysisTopOrders') sortState = S.analysisTopOrdersSort;
  else if (tab === 'analysisTopValue') sortState = S.analysisTopValueSort;
  else if (tab === 'analysisType') sortState = S.analysisTypeSort;
  else if (tab === 'analysisCampaigns') sortState = S.analysisCampaignsSort;
  
  if (sortState.column === column) {
    // Cycle through: asc → desc → none
    sortState.direction = (sortState.direction + 1) % 3;
    if (sortState.direction === 0) sortState.column = null;
  } else {
    sortState.column = column;
    sortState.direction = 1; // Start with ascending
  }
  
  render();
}

function getSortIndicator(tab, column) {
  let sortState;
  if (tab === 'accounts') sortState = S.accountsSort;
  else if (tab === 'campaigns') sortState = S.campaignsSort;
  else if (tab === 'orders') sortState = S.ordersSort;
  else if (tab === 'analysisAgents') sortState = S.analysisAgentsSort;
  else if (tab === 'analysisTopSales') sortState = S.analysisTopSalesSort;
  else if (tab === 'analysisTopOrders') sortState = S.analysisTopOrdersSort;
  else if (tab === 'analysisTopValue') sortState = S.analysisTopValueSort;
  else if (tab === 'analysisType') sortState = S.analysisTypeSort;
  else if (tab === 'analysisCampaigns') sortState = S.analysisCampaignsSort;
  
  if (sortState.column !== column) return '';
  return sortState.direction === 1 ? ' ↑' : sortState.direction === 2 ? ' ↓' : '';
}

function applySorting(data, tab, columns) {
  let sortState;
  if (tab === 'accounts') sortState = S.accountsSort;
  else if (tab === 'campaigns') sortState = S.campaignsSort;
  else if (tab === 'orders') sortState = S.ordersSort;
  else if (tab === 'analysisAgents') sortState = S.analysisAgentsSort;
  else if (tab === 'analysisTopSales') sortState = S.analysisTopSalesSort;
  else if (tab === 'analysisTopOrders') sortState = S.analysisTopOrdersSort;
  else if (tab === 'analysisTopValue') sortState = S.analysisTopValueSort;
  else if (tab === 'analysisType') sortState = S.analysisTypeSort;
  else if (tab === 'analysisCampaigns') sortState = S.analysisCampaignsSort;
  
  if (!sortState.column || sortState.direction === 0) return data;
  
  const column = sortState.column;
  const dir = sortState.direction === 1 ? 1 : -1;
  
  return [...data].sort((a, b) => {
    let aVal = a[column];
    let bVal = b[column];
    
    // Handle special cases
    if (column === 'companyName' || column === 'name') {
      aVal = (aVal || '').toLowerCase();
      bVal = (bVal || '').toLowerCase();
    } else if (typeof aVal === 'number' || typeof bVal === 'number') {
      aVal = parseFloat(aVal) || 0;
      bVal = parseFloat(bVal) || 0;
    } else if (typeof aVal === 'string') {
      aVal = aVal.toLowerCase();
      bVal = (bVal || '').toLowerCase();
    }
    
    if (aVal < bVal) return -1 * dir;
    if (aVal > bVal) return 1 * dir;
    return 0;
  });
}

  S.customers.forEach(customer => {

      const key = 'WhatsApp|' + customer.whatsappCampaign;
      if (!campaignMap[key]) {
        campaignMap[key] = {
          type: 'WhatsApp',
          name: customer.whatsappCampaign,
          dates: [],
          customers: [],
          interested: 0,
          notInterested: 0,
          pending: 0

      if (customer.whatsappCampaignDate && !campaignMap[key].dates.includes(customer.whatsappCampaignDate)) {
        campaignMap[key].dates.push(customer.whatsappCampaignDate);
      }
      campaignMap[key].customers.push(customer.companyName);
      if (customer.whatsappInterested === 'Interested') campaignMap[key].interested++;
      else if (customer.whatsappInterested === 'Not Interested') campaignMap[key].notInterested++;
      else if (customer.whatsappInterested === 'Pending') campaignMap[key].pending++;
    }
    
    // Current Telesales

      const key = 'Telesales|' + customer.telesalesCampaign;

          dates: [],

          interested: 0,
          notInterested: 0,
          pending: 0
        };

        campaignMap[key].dates.push(customer.telesalesCampaignDate);
      }
      campaignMap[key].customers.push(customer.companyName);
      if (customer.telesalesInterested === 'Interested') campaignMap[key].interested++;
      else if (customer.telesalesInterested === 'Not Interested') campaignMap[key].notInterested++;
      else if (customer.telesalesInterested === 'Pending') campaignMap[key].pending++;
    }
    
    // Current Dashboard
    if (customer.dashboardCampaign) {
      const key = 'Dashboard|' + customer.dashboardCampaign;
      if (!campaignMap[key]) {
        campaignMap[key] = {
          type: 'Dashboard',
          name: customer.dashboardCampaign,
          dates: [],
          customers: [],
          interested: 0,
          notInterested: 0,
          pending: 0
        };
      }
      if (customer.dashboardCampaignDate && !campaignMap[key].dates.includes(customer.dashboardCampaignDate)) {
        campaignMap[key].dates.push(customer.dashboardCampaignDate);
      }
      campaignMap[key].customers.push(customer.companyName);
      if (customer.dashboardInterested === 'Interested') campaignMap[key].interested++;
      else if (customer.dashboardInterested === 'Not Interested') campaignMap[key].notInterested++;
      else if (customer.dashboardInterested === 'Pending') campaignMap[key].pending++;
    }
    
    // Historical campaigns
    if (customer.campaignHistory) {
      customer.campaignHistory.forEach(hist => {
        const key = hist.type + '|' + hist.name + '|HISTORICAL';
        if (!campaignMap[key]) {
          campaignMap[key] = {
            type: hist.type,
            name: hist.name,
            dates: [],
            customers: [],
            interested: 0,
            notInterested: 0,
            pending: 0,
            isHistorical: true
          };
        }
        if (hist.date && !campaignMap[key].dates.includes(hist.date)) {
          campaignMap[key].dates.push(hist.date);
        }
        campaignMap[key].customers.push(customer.companyName);
        if (hist.interested === 'Interested') campaignMap[key].interested++;
        else if (hist.interested === 'Not Interested') campaignMap[key].notInterested++;
        else if (hist.interested === 'Pending') campaignMap[key].pending++;
      });
    }
  });
  
  // Convert to array and sort by name
  const campaigns = Object.values(campaignMap).sort((a, b) => {
    return a.name.localeCompare(b.name);
  });
  
  // Auto-archive campaigns with zero pending

    if (c.pending === 0 && !c.isHistorical) {

          (campaign.type === 'Telesales' && customer.telesalesCampaign === campaign.name) ||
          (campaign.type === 'Dashboard' && customer.dashboardCampaign === campaign.name) ||

      const campaignOrders = getCampaignOrders(c);
      return {
        ...c,
        total: c.customers.length,
        orderCount: campaignOrders.length,

      };

    html += '<th onclick="sortTable(\'campaigns\', \'type\')" style="cursor:pointer">Type' + getSortIndicator('campaigns', 'type') + '</th>';
    html += '<th>Date(s) Sent</th>';

    html += '<th onclick="sortTable(\'campaigns\', \'interested\')" style="cursor:pointer">Interested' + getSortIndicator('campaigns', 'interested') + '</th>';
    html += '<th onclick="sortTable(\'campaigns\', \'notInterested\')" style="cursor:pointer">Not Interested' + getSortIndicator('campaigns', 'notInterested') + '</th>';
    html += '<th onclick="sortTable(\'campaigns\', \'pending\')" style="cursor:pointer">Pending' + getSortIndicator('campaigns', 'pending') + '</th>';
    html += '<th onclick="sortTable(\'campaigns\', \'orderCount\')" style="cursor:pointer">Orders' + getSortIndicator('campaigns', 'orderCount') + '</th>';
    html += '<th onclick="sortTable(\'campaigns\', \'revenue\')" style="cursor:pointer">Sales' + getSortIndicator('campaigns', 'revenue') + '</th>';
    html += '<th>$/Customer</th>';
    html += '<th>Success Rate</th>';
    html += '<th>Action</th>';
    html += '</tr></thead>';
    html += '<tbody>';
    
    sortableHistorical.forEach(c => {
      const typeColor = c.type === 'WhatsApp' ? '#0ea5e9' : c.type === 'Telesales' ? '#8b5cf6' : '#f59e0b';
      const typeIcon = c.type === 'WhatsApp' ? '💬' : c.type === 'Telesales' ? '📞' : '🎯';
      const total = c.total;
      const successRate = total > 0 ? Math.round((c.interested / total) * 100) : 0;
      
      // Use pre-calculated values
      const campaignOrders = getCampaignOrders(c);
      const orderCount = c.orderCount;
      const revenue = c.revenue;
      const revenuePerCustomer = total > 0 ? Math.round(revenue / total) : 0;
      
      // Sort dates and format
      const sortedDates = c.dates.sort((a, b) => new Date(b) - new Date(a));
      const dateDisplay = sortedDates.length > 0 ? sortedDates.map(d => convertToUS(d)).join(', ') : '—';
      
      const campaignKey = c.type + '|' + c.name;
      const isExpanded = S.expandedCampaign === campaignKey;
      
      html += '<tr onclick="toggleCampaignExpand(\'' + campaignKey.replace(/'/g, "\\'") + '\')" style="opacity:0.7;cursor:pointer">';
      html += '<td><div style="font-size:13px">' + c.name + '</div></td>';
      html += '<td><span style="color:' + typeColor + ';font-weight:600">' + typeIcon + ' ' + c.type + '</span></td>';
      html += '<td style="font-size:12px">' + dateDisplay + '</td>';
      html += '<td>' + total + '</td>';
      html += '<td><span style="color:var(--green)">' + c.interested + '</span></td>';
      html += '<td><span style="color:var(--red)">' + c.notInterested + '</span></td>';
      html += '<td><span style="color:var(--txt3)">' + c.pending + '</span></td>';
      html += '<td><span style="font-weight:600;color:var(--blue);opacity:1">' + orderCount + '</span></td>';
      html += '<td><span style="font-weight:600;color:var(--green);opacity:1">$' + revenue.toLocaleString() + '</span></td>';
      html += '<td style="font-size:13px;color:var(--oct);opacity:1">$' + revenuePerCustomer.toLocaleString() + '</td>';
      html += '<td><div style="font-size:14px;color:' + (successRate >= 50 ? 'var(--green)' : successRate >= 25 ? 'var(--oct)' : 'var(--red)') + '">' + successRate + '%</div></td>';
      html += '<td><button class="btn-secondary" style="padding:6px 12px;font-size:12px;background:var(--red);color:white;opacity:1" onclick="event.stopPropagation();deleteCampaign(\'' + c.type + '\', \'' + c.name.replace(/'/g, "\\'") + '\')">🗑️ Delete</button></td>';
      html += '</tr>';
      
      if (isExpanded) {
        html += '<tr><td colspan="12" style="padding:0;opacity:1"><div style="padding:20px;background:var(--surface2);border-top:1px solid var(--border)">';
        html += '<div style="font-weight:700;margin-bottom:15px;font-size:15px">📊 Campaign Details: ' + c.name + ' (Historical)</div>';
        
        html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px">';
        html += '<div style="background:var(--surface);padding:12px;border-radius:6px"><div style="font-size:11px;color:var(--txt3);margin-bottom:4px">TOTAL REACH</div><div style="font-size:20px;font-weight:700">' + total + '</div></div>';
        html += '<div style="background:var(--surface);padding:12px;border-radius:6px"><div style="font-size:11px;color:var(--txt3);margin-bottom:4px">ORDERS CLOSED</div><div style="font-size:20px;font-weight:700;color:var(--blue)">' + orderCount + '</div></div>';
        html += '<div style="background:var(--surface);padding:12px;border-radius:6px"><div style="font-size:11px;color:var(--txt3);margin-bottom:4px">TOTAL SALES</div><div style="font-size:20px;font-weight:700;color:var(--green)">$' + revenue.toLocaleString() + '</div></div>';
        html += '<div style="background:var(--surface);padding:12px;border-radius:6px"><div style="font-size:11px;color:var(--txt3);margin-bottom:4px">CONVERSION RATE</div><div style="font-size:20px;font-weight:700;color:var(--oct)">' + (total > 0 ? Math.round((orderCount / total) * 100) : 0) + '%</div></div>';
        html += '</div>';
        
        if (campaignOrders.length > 0) {
          html += '<div style="margin-bottom:15px"><strong>Orders (' + orderCount + '):</strong></div>';
          html += '<div style="max-height:200px;overflow-y:auto">';
          campaignOrders.forEach(order => {
            const customer = S.customers.find(cust => cust.id === order.customerId);
            html += '<div style="background:var(--surface);padding:10px;margin-bottom:8px;border-radius:6px;border-left:3px solid var(--green)">';
            html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px">';
            html += '<div style="font-weight:600">' + (customer ? customer.companyName : order.customerId) + '</div>';
            html += '<div style="color:var(--green);font-weight:700">$' + (parseFloat(order.sellingPrice) || 0).toLocaleString() + '</div>';
            html += '</div>';
            html += '<div style="font-size:12px;color:var(--txt3)">' + order.productType + ' - ' + order.productBrand + ' (' + order.quantity + ' units)</div>';
            html += '<div style="font-size:11px;color:var(--txt2);margin-top:4px">Order: ' + order.salesOrderId + ' | Status: ' + order.status + '</div>';
            html += '</div>';
          });
          html += '</div>';
        }
        
        html += '</div></td></tr>';
      }
    });
    
    html += '</tbody></table></div></div>';
  }
  
  if (totalCampaigns === 0) {
    html += '<div class="empty">No campaigns yet. Add campaigns to customers to see analytics here.</div>';
  }
  
  html += '</div>';
  return html;
}

// ANALYSIS PAGE
function renderAnalysis() {
  let html = '<div>';
  html += '<div class="page-head">';
  html += '<div><div class="ph-title">📊 Analytics Dashboard</div><div class="ph-sub">Comprehensive performance analysis</div></div>';
  html += '</div>';
  
  // ============================================
  // SECTION 1: O-STORE AGENT PERFORMANCE
  // ============================================
  html += '<div style="margin-top:30px">';
  html += '<h2 style="font-size:20px;font-weight:700;color:var(--txt);margin-bottom:20px">👥 O-store Agent Performance</h2>';
  
  // Calculate agent metrics
  const agentStats = {};
  
  S.customers.forEach(c => {
    const am = c.ostoreAM || 'Unassigned';
    if (!agentStats[am]) {
      agentStats[am] = {
        name: am,
        totalLeads: 0,
        interestedLeads: 0,
        orders: 0,
        sales: 0,
        lubesSales: 0,
        tiresSales: 0,
        batteriesSales: 0
      };
    }
    
    agentStats[am].totalLeads++;
    
    // Check if interested in any campaign
    if (c.whatsappInterested === 'Interested' || c.telesalesInterested === 'Interested' || c.dashboardInterested === 'Interested') {
      agentStats[am].interestedLeads++;
    }
    
    // Calculate orders and sales
    const customerOrders = S.orders.filter(o => o.customerId === c.id);
    agentStats[am].orders += customerOrders.length;
    
    customerOrders.forEach(o => {
      const price = parseFloat(o.sellingPrice) || 0;
      agentStats[am].sales += price;
      
      if (o.productType === 'Lubes') agentStats[am].lubesSales += price;
      else if (o.productType === 'Tires') agentStats[am].tiresSales += price;
      else if (o.productType === 'Batteries') agentStats[am].batteriesSales += price;
    });
  });
  
  // Convert to array and calculate conversion rates
  let agents = Object.values(agentStats).map(a => ({
    ...a,
    conversionRate: a.totalLeads > 0 ? Math.round((a.interestedLeads / a.totalLeads) * 100) : 0,
    orderConversionRate: a.totalLeads > 0 ? Math.round((a.orders / a.totalLeads) * 100) : 0,
    avgOrderValue: a.orders > 0 ? Math.round(a.sales / a.orders) : 0
  })).sort((a, b) => b.sales - a.sales);
  
  // Apply sorting to agents
  let sortedAgents = applySorting(agents, 'analysisAgents', ['name', 'totalLeads', 'interestedLeads', 'conversionRate', 'orders', 'orderConversionRate', 'sales', 'avgOrderValue']);
  
  // Agent performance table
  if (sortedAgents.length > 0) {
    html += '<div class="tbl-wrap"><table class="tbl">';
    html += '<thead><tr>';
    html += '<th onclick="sortTable(\'analysisAgents\', \'name\')" style="cursor:pointer">Agent' + getSortIndicator('analysisAgents', 'name') + '</th>';
    html += '<th onclick="sortTable(\'analysisAgents\', \'totalLeads\')" style="cursor:pointer">Total Leads' + getSortIndicator('analysisAgents', 'totalLeads') + '</th>';
    html += '<th onclick="sortTable(\'analysisAgents\', \'interestedLeads\')" style="cursor:pointer">Interested' + getSortIndicator('analysisAgents', 'interestedLeads') + '</th>';
    html += '<th onclick="sortTable(\'analysisAgents\', \'conversionRate\')" style="cursor:pointer">Interest Rate' + getSortIndicator('analysisAgents', 'conversionRate') + '</th>';
    html += '<th onclick="sortTable(\'analysisAgents\', \'orders\')" style="cursor:pointer">Orders Closed' + getSortIndicator('analysisAgents', 'orders') + '</th>';
    html += '<th onclick="sortTable(\'analysisAgents\', \'orderConversionRate\')" style="cursor:pointer">Order Conv. Rate' + getSortIndicator('analysisAgents', 'orderConversionRate') + '</th>';
    html += '<th onclick="sortTable(\'analysisAgents\', \'sales\')" style="cursor:pointer">Total Sales' + getSortIndicator('analysisAgents', 'sales') + '</th>';
    html += '<th onclick="sortTable(\'analysisAgents\', \'avgOrderValue\')" style="cursor:pointer">Avg Order Value' + getSortIndicator('analysisAgents', 'avgOrderValue') + '</th>';
    html += '<th>Top Product</th>';
    html += '</tr></thead>';
    html += '<tbody>';
    
    sortedAgents.forEach(a => {
      const topProduct = a.lubesSales > a.tiresSales && a.lubesSales > a.batteriesSales ? 'Lubes' :
                         a.tiresSales > a.batteriesSales ? 'Tires' : 'Batteries';
      const convColor = a.conversionRate >= 50 ? 'var(--green)' : a.conversionRate >= 30 ? 'var(--oct)' : 'var(--red)';
      const orderConvColor = a.orderConversionRate >= 30 ? 'var(--green)' : a.orderConversionRate >= 15 ? 'var(--oct)' : 'var(--red)';
      
      html += '<tr>';
      html += '<td><strong>' + a.name + '</strong></td>';
      html += '<td>' + a.totalLeads + '</td>';
      html += '<td style="color:var(--green);font-weight:600">' + a.interestedLeads + '</td>';
      html += '<td style="color:' + convColor + ';font-weight:700">' + a.conversionRate + '%</td>';
      html += '<td style="color:var(--blue);font-weight:600">' + a.orders + '</td>';
      html += '<td style="color:' + orderConvColor + ';font-weight:700">' + a.orderConversionRate + '%</td>';
      html += '<td style="color:var(--green);font-weight:700">$' + a.sales.toLocaleString() + '</td>';
      html += '<td style="font-weight:600">$' + a.avgOrderValue.toLocaleString() + '</td>';
      html += '<td>' + topProduct + '</td>';
      html += '</tr>';
    });
    
    html += '</tbody></table></div>';
  }
  
  html += '</div>';
  
  // ============================================

  // ============================================
  html += '<div style="margin-top:40px">';

  // Calculate customer metrics
  const customerMetrics = S.customers.map(c => {

    const sales = orders.reduce((sum, o) => sum + (parseFloat(o.sellingPrice) || 0), 0);
    const productTypes = new Set(orders.map(o => o.productType).filter(Boolean));
    
    return {
      id: c.id,
      name: c.companyName,
      orderCount: orders.length,
      sales: sales,
      avgOrderValue: orders.length > 0 ? Math.round(sales / orders.length) : 0,
      productDiversity: productTypes.size,
      city: c.city || '—',

  let topByOrders = [...customerMetrics].sort((a, b) => b.orderCount - a.orderCount).slice(0, 10);
  topByOrders = applySorting(topByOrders, 'analysisTopOrders', ['name', 'orderCount', 'sales', 'avgOrderValue']);
  
  let topByAvgValue = [...customerMetrics].sort((a, b) => b.avgOrderValue - a.avgOrderValue).slice(0, 10);
  topByAvgValue = applySorting(topByAvgValue, 'analysisTopValue', ['name', 'avgOrderValue', 'orderCount', 'sales']);
  
  // Top 10 by Sales
  html += '<h3 style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:15px;margin-top:20px">🏆 Top 10 Customers by Sales</h3>';
  html += '<div class="tbl-wrap"><table class="tbl">';
  html += '<thead><tr>';
  html += '<th>Rank</th>';
  html += '<th onclick="sortTable(\'analysisTopSales\', \'name\')" style="cursor:pointer">Customer' + getSortIndicator('analysisTopSales', 'name') + '</th>';
  html += '<th onclick="sortTable(\'analysisTopSales\', \'city\')" style="cursor:pointer">City' + getSortIndicator('analysisTopSales', 'city') + '</th>';
  html += '<th onclick="sortTable(\'analysisTopSales\', \'sales\')" style="cursor:pointer">Total Sales' + getSortIndicator('analysisTopSales', 'sales') + '</th>';

  html += '<th onclick="sortTable(\'analysisTopSales\', \'avgOrderValue\')" style="cursor:pointer">Avg Order Value' + getSortIndicator('analysisTopSales', 'avgOrderValue') + '</th>';
  html += '<th onclick="sortTable(\'analysisTopSales\', \'productDiversity\')" style="cursor:pointer">Product Diversity' + getSortIndicator('analysisTopSales', 'productDiversity') + '</th>';
  html += '</tr></thead>';
  html += '<tbody>';
  
  topBySales.forEach((c, idx) => {

    const rankEmoji = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1);
    
    html += '<tr>';
    html += '<td style="color:' + rankColor + ';font-weight:700;font-size:16px">' + rankEmoji + '</td>';

    html += '<td>' + c.city + '</td>';
    html += '<td style="color:var(--green);font-weight:700">$' + c.sales.toLocaleString() + '</td>';
    html += '<td style="font-weight:600">' + c.orderCount + '</td>';
    html += '<td style="font-weight:600">$' + c.avgOrderValue.toLocaleString() + '</td>';
    html += '<td>' + c.productDiversity + ' types</td>';
    html += '</tr>';
  });
  
  html += '</tbody></table></div>';
  
  // Top 10 by Order Count
  html += '<h3 style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:15px;margin-top:25px">📦 Top 10 Most Frequent Buyers</h3>';
  html += '<div class="tbl-wrap"><table class="tbl">';
  html += '<thead><tr>';
  html += '<th>Rank</th>';
  html += '<th onclick="sortTable(\'analysisTopOrders\', \'name\')" style="cursor:pointer">Customer' + getSortIndicator('analysisTopOrders', 'name') + '</th>';
  html += '<th onclick="sortTable(\'analysisTopOrders\', \'orderCount\')" style="cursor:pointer">Orders' + getSortIndicator('analysisTopOrders', 'orderCount') + '</th>';
  html += '<th onclick="sortTable(\'analysisTopOrders\', \'sales\')" style="cursor:pointer">Total Sales' + getSortIndicator('analysisTopOrders', 'sales') + '</th>';
  html += '<th onclick="sortTable(\'analysisTopOrders\', \'avgOrderValue\')" style="cursor:pointer">Avg Order Value' + getSortIndicator('analysisTopOrders', 'avgOrderValue') + '</th>';
  html += '</tr></thead>';
  html += '<tbody>';
  
  topByOrders.forEach((c, idx) => {
    html += '<tr>';
    html += '<td style="font-weight:600">' + (idx + 1) + '</td>';
    html += '<td><strong>' + c.name + '</strong></td>';
    html += '<td style="color:var(--blue);font-weight:700">' + c.orderCount + '</td>';
    html += '<td style="color:var(--green);font-weight:600">$' + c.sales.toLocaleString() + '</td>';
    html += '<td>$' + c.avgOrderValue.toLocaleString() + '</td>';
    html += '</tr>';
  });
  
  html += '</tbody></table></div>';
  
  // Top 10 by Average Order Value
  html += '<h3 style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:15px;margin-top:25px">💎 Top 10 Highest Value Customers</h3>';
  html += '<div class="tbl-wrap"><table class="tbl">';
  html += '<thead><tr>';

  html += '<th onclick="sortTable(\'analysisTopValue\', \'avgOrderValue\')" style="cursor:pointer">Avg Order Value' + getSortIndicator('analysisTopValue', 'avgOrderValue') + '</th>';
  html += '<th onclick="sortTable(\'analysisTopValue\', \'orderCount\')" style="cursor:pointer">Orders' + getSortIndicator('analysisTopValue', 'orderCount') + '</th>';

      if (customer.whatsappDate) campaignMap[key].dates.push(customer.whatsappDate);
      if (customer.whatsappInterested === 'Interested') campaignMap[key].interested++;
      else if (customer.whatsappInterested === 'Not interested') campaignMap[key].notInterested++;
      else if (customer.whatsappInterested === 'Pending') campaignMap[key].pending++;
    }
    
    // Telesales campaigns
    if (customer.telesalesCampaign) {
      const key = 'Telesales|' + customer.telesalesCampaign;
      if (!campaignMap[key]) {
        campaignMap[key] = {
          type: 'Telesales',
          name: customer.telesalesCampaign,
          customers: [],
          dates: [],
          interested: 0,
          notInterested: 0,
          pending: 0,
          isHistorical: false
        };
      }
      campaignMap[key].customers.push(customer.id);
      if (customer.telesalesDate) campaignMap[key].dates.push(customer.telesalesDate);
      if (customer.telesalesInterested === 'Interested') campaignMap[key].interested++;
      else if (customer.telesalesInterested === 'Not interested') campaignMap[key].notInterested++;
      else if (customer.telesalesInterested === 'Pending') campaignMap[key].pending++;
    }
    
    // Dashboard campaigns
    if (customer.dashboardCampaign) {
      const key = 'Dashboard|' + customer.dashboardCampaign;
      if (!campaignMap[key]) {
        campaignMap[key] = {
          type: 'Dashboard',
          name: customer.dashboardCampaign,
          customers: [],
          dates: [],
          interested: 0,
          notInterested: 0,
          pending: 0,
          isHistorical: false
        };
      }
      campaignMap[key].customers.push(customer.id);
      if (customer.dashboardDate) campaignMap[key].dates.push(customer.dashboardDate);
      if (customer.dashboardInterested === 'Interested') campaignMap[key].interested++;
      else if (customer.dashboardInterested === 'Not interested') campaignMap[key].notInterested++;
      else if (customer.dashboardInterested === 'Pending') campaignMap[key].pending++;
    }
    
    // HISTORICAL CAMPAIGNS (was missing!)
    if (customer.campaignHistory) {
      customer.campaignHistory.forEach(hist => {
        const key = hist.type + '|' + hist.name + '|HISTORICAL';
        if (!campaignMap[key]) {
          campaignMap[key] = {
            type: hist.type,
            name: hist.name,
            customers: [],
            dates: [],
            interested: 0,
            notInterested: 0,
            pending: 0,
            isHistorical: true
          };
        }
        campaignMap[key].customers.push(customer.id);
        if (hist.date) campaignMap[key].dates.push(hist.date);
        if (hist.interested === 'Interested') campaignMap[key].interested++;
        else if (hist.interested === 'Not interested') campaignMap[key].notInterested++;
        else if (hist.interested === 'Pending') campaignMap[key].pending++;
      });
    }
  });
  
  // Convert to array and calculate order metrics using getCampaignOrders()
  const campaigns = Object.values(campaignMap).map(c => {
    const campaignOrders = getCampaignOrders(c); // Use the CORRECT function!
    const revenue = campaignOrders.reduce((sum, o) => sum + (parseFloat(o.sellingPrice) || 0), 0);
    const cost = campaignOrders.reduce((sum, o) => sum + (parseFloat(o.cost) || 0), 0);
    const profit = revenue - cost;
    const margin = revenue > 0 ? Math.round((profit / revenue) * 100) : 0;
    
    return {
      ...c,
      reach: c.customers.length,
      orders: campaignOrders.length,
      sales: revenue,
      cost: cost,
      profit: profit,
      margin: margin,
      orderConvRate: c.customers.length > 0 ? Math.round((campaignOrders.length / c.customers.length) * 100) : 0,
      avgOrderValue: campaignOrders.length > 0 ? Math.round(revenue / campaignOrders.length) : 0
    };
  });
  
  // Campaign type comparison
  const typeStats = {
    WhatsApp: { campaigns: 0, reach: 0, interested: 0, orders: 0, sales: 0, cost: 0, profit: 0 },
    Telesales: { campaigns: 0, reach: 0, interested: 0, orders: 0, sales: 0, cost: 0, profit: 0 },
    Dashboard: { campaigns: 0, reach: 0, interested: 0, orders: 0, sales: 0, cost: 0, profit: 0 }
  };
  
  campaigns.forEach(c => {
    if (typeStats[c.type]) {
      typeStats[c.type].campaigns++;
      typeStats[c.type].reach += c.reach;
      typeStats[c.type].interested += c.interested;
      typeStats[c.type].orders += c.orders;
      typeStats[c.type].sales += c.sales;
      typeStats[c.type].cost += c.cost;
      typeStats[c.type].profit += c.profit;
    }
  });
  
  // Convert typeStats to array for sorting
  let typeStatsArray = Object.entries(typeStats).map(([type, stats]) => ({
    type: type,
    ...stats,
    orderConv: stats.reach > 0 ? Math.round((stats.orders / stats.reach) * 100) : 0,
    avgSales: stats.campaigns > 0 ? Math.round(stats.sales / stats.campaigns) : 0,
    avgMargin: stats.sales > 0 ? Math.round((stats.profit / stats.sales) * 100) : 0
  }));
  
  // Apply sorting
  typeStatsArray = applySorting(typeStatsArray, 'analysisType', ['type', 'campaigns', 'reach', 'orders', 'orderConv', 'sales', 'avgMargin', 'avgSales']);
  
  // Campaign Type Performance
  html += '<h3 style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:15px">📊 Performance by Campaign Type</h3>';
  html += '<div class="tbl-wrap"><table class="tbl">';
  html += '<thead><tr>';
  html += '<th onclick="sortTable(\'analysisType\', \'type\')" style="cursor:pointer">Type' + getSortIndicator('analysisType', 'type') + '</th>';
  html += '<th onclick="sortTable(\'analysisType\', \'campaigns\')" style="cursor:pointer">Campaigns' + getSortIndicator('analysisType', 'campaigns') + '</th>';
  html += '<th onclick="sortTable(\'analysisType\', \'reach\')" style="cursor:pointer">Total Reach' + getSortIndicator('analysisType', 'reach') + '</th>';
  html += '<th onclick="sortTable(\'analysisType\', \'orders\')" style="cursor:pointer">Orders' + getSortIndicator('analysisType', 'orders') + '</th>';
  html += '<th onclick="sortTable(\'analysisType\', \'orderConv\')" style="cursor:pointer">Order Conv. Rate' + getSortIndicator('analysisType', 'orderConv') + '</th>';
  html += '<th onclick="sortTable(\'analysisType\', \'sales\')" style="cursor:pointer">Total Sales' + getSortIndicator('analysisType', 'sales') + '</th>';
  html += '<th onclick="sortTable(\'analysisType\', \'avgMargin\')" style="cursor:pointer">Avg Margin %' + getSortIndicator('analysisType', 'avgMargin') + '</th>';
  html += '<th onclick="sortTable(\'analysisType\', \'avgSales\')" style="cursor:pointer">Sales per Campaign' + getSortIndicator('analysisType', 'avgSales') + '</th>';
  html += '</tr></thead>';
  html += '<tbody>';
  
  typeStatsArray.forEach(stats => {
    const typeColor = stats.type === 'WhatsApp' ? '#0ea5e9' : stats.type === 'Telesales' ? '#8b5cf6' : '#f59e0b';
    const marginColor = stats.avgMargin >= 20 ? 'var(--green)' : stats.avgMargin >= 10 ? 'var(--oct)' : 'var(--red)';
    
    html += '<tr>';
    html += '<td style="color:' + typeColor + ';font-weight:700">' + stats.type + '</td>';
    html += '<td>' + stats.campaigns + '</td>';
    html += '<td style="font-weight:600">' + stats.reach + '</td>';
    html += '<td style="color:var(--blue);font-weight:700">' + stats.orders + '</td>';
    html += '<td style="color:var(--oct);font-weight:700">' + stats.orderConv + '%</td>';
    html += '<td style="color:var(--green);font-weight:700">$' + stats.sales.toLocaleString() + '</td>';
    html += '<td style="color:' + marginColor + ';font-weight:700">' + stats.avgMargin + '%</td>';
    html += '<td style="font-weight:600">$' + stats.avgSales.toLocaleString() + '</td>';
    html += '</tr>';
  });
  
  html += '</tbody></table></div>';
  
  // Best performing campaigns
  let bestCampaigns = campaigns.filter(c => c.orders > 0).sort((a, b) => b.sales - a.sales).slice(0, 10);
  bestCampaigns = applySorting(bestCampaigns, 'analysisCampaigns', ['name', 'type', 'reach', 'orders', 'orderConvRate', 'sales', 'margin', 'avgOrderValue']);
  
  if (bestCampaigns.length > 0) {
    html += '<h3 style="font-size:16px;font-weight:600;color:var(--txt);margin-bottom:15px;margin-top:25px">🏆 Top 10 Campaigns by Revenue</h3>';
    html += '<div class="tbl-wrap"><table class="tbl">';
    html += '<thead><tr>';
    html += '<th>Rank</th>';
    html += '<th onclick="sortTable(\'analysisCampaigns\', \'name\')" style="cursor:pointer">Campaign' + getSortIndicator('analysisCampaigns', 'name') + '</th>';
    html += '<th onclick="sortTable(\'analysisCampaigns\', \'type\')" style="cursor:pointer">Type' + getSortIndicator('analysisCampaigns', 'type') + '</th>';
    html += '<th onclick="sortTable(\'analysisCampaigns\', \'reach\')" style="cursor:pointer">Reach' + getSortIndicator('analysisCampaigns', 'reach') + '</th>';
    html += '<th onclick="sortTable(\'analysisCampaigns\', \'orders\')" style="cursor:pointer">Orders' + getSortIndicator('analysisCampaigns', 'orders') + '</th>';
    html += '<th onclick="sortTable(\'analysisCampaigns\', \'orderConvRate\')" style="cursor:pointer">Conv. Rate' + getSortIndicator('analysisCampaigns', 'orderConvRate') + '</th>';
    html += '<th onclick="sortTable(\'analysisCampaigns\', \'sales\')" style="cursor:pointer">Total Sales' + getSortIndicator('analysisCampaigns', 'sales') + '</th>';
    html += '<th onclick="sortTable(\'analysisCampaigns\', \'margin\')" style="cursor:pointer">Margin %' + getSortIndicator('analysisCampaigns', 'margin') + '</th>';
    html += '<th onclick="sortTable(\'analysisCampaigns\', \'avgOrderValue\')" style="cursor:pointer">Avg Order Value' + getSortIndicator('analysisCampaigns', 'avgOrderValue') + '</th>';
    html += '</tr></thead>';
    html += '<tbody>';
    
    bestCampaigns.forEach((c, idx) => {
      const rankEmoji = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1);
      const typeColor = c.type === 'WhatsApp' ? '#0ea5e9' : c.type === 'Telesales' ? '#8b5cf6' : '#f59e0b';
      const marginColor = c.margin >= 20 ? 'var(--green)' : c.margin >= 10 ? 'var(--oct)' : 'var(--red)';
      
      html += '<tr>';
      html += '<td style="font-weight:700;font-size:16px">' + rankEmoji + '</td>';
      html += '<td><strong>' + c.name + '</strong></td>';
      html += '<td style="color:' + typeColor + ';font-weight:600">' + c.type + '</td>';
      html += '<td>' + c.reach + '</td>';
      html += '<td style="color:var(--blue);font-weight:700">' + c.orders + '</td>';
      html += '<td style="color:var(--oct);font-weight:700">' + c.orderConvRate + '%</td>';
      html += '<td style="color:var(--green);font-weight:700">$' + c.sales.toLocaleString() + '</td>';
      html += '<td style="color:' + marginColor + ';font-weight:700">' + c.margin + '%</td>';
      html += '<td style="font-weight:600">$' + c.avgOrderValue.toLocaleString() + '</td>';
      html += '</tr>';
    });
    
    html += '</tbody></table></div>';
  }
  
  html += '</div>';
  
  html += '</div>';
  return html;
}

  html += '<div class="stat"><div class="stat-lbl">Completed</div><div class="stat-val" style="color:var(--green)">' + completed + '</div></div>';

  html += '<div class="stat"><div class="stat-lbl">Tires Sales</div><div class="stat-val" style="color:#8b5cf6">$' + tiresSales.toLocaleString() + '</div></div>';

  productTypes.forEach(p => html += '<option value="' + p + '"' + (S.oProductType === p ? ' selected' : '') + '>' + p + '</option>');
  html += '</select>';

  salesPersons.forEach(sp => html += '<option value="' + sp + '"' + (S.oSalesPerson === sp ? ' selected' : '') + '>' + sp + '</option>');
  html += '</select>';

  campaignNames.forEach(cn => html += '<option value="' + cn + '"' + (S.oCampaignName === cn ? ' selected' : '') + '>' + cn + '</option>');

  // Product Brand filter
  if (S.oProductBrand) filteredOrders = filteredOrders.filter(o => o.productBrand === S.oProductBrand);
  
  // Sales Person filter
  if (S.oSalesPerson) filteredOrders = filteredOrders.filter(o => o.salesPerson === S.oSalesPerson);
  
  // Campaign Name filter
  if (S.oCampaignName) filteredOrders = filteredOrders.filter(o => o.campaignName === S.oCampaignName);
  
  // Campaign Type filter
  if (S.oCampaignType) filteredOrders = filteredOrders.filter(o => o.campaignChannel === S.oCampaignType);

        quantityNum: parseInt(o.quantity) || 0
      };

    html += '<th onclick="sortTable(\'orders\', \'quantityNum\')" style="cursor:pointer">Quantity' + getSortIndicator('orders', 'quantityNum') + '</th>';
    html += '<th onclick="sortTable(\'orders\', \'sellingPriceNum\')" style="cursor:pointer">Selling Price' + getSortIndicator('orders', 'sellingPriceNum') + '</th>';
    html += '<th onclick="sortTable(\'orders\', \'margin\')" style="cursor:pointer">Margin %' + getSortIndicator('orders', 'margin') + '</th>';
    html += '<th onclick="sortTable(\'orders\', \'status\')" style="cursor:pointer">Status' + getSortIndicator('orders', 'status') + '</th>';
    html += '<th onclick="sortTable(\'orders\', \'salesPerson\')" style="cursor:pointer">Sales Person' + getSortIndicator('orders', 'salesPerson') + '</th>';

      const isExpanded = S.expandedOrder === o.salesOrderId;

function deleteCampaign(type, name) {
  const message = 'Are you sure you want to delete "' + name + '" (' + type + ') from ALL customers?\n\nThis will remove it from:\n- Current campaigns\n- Campaign history\n\nThis action cannot be undone!';
  
  if (!confirm(message)) return;
  
  let removedCount = 0;
  
  S.customers.forEach(customer => {
    let wasRemoved = false;
    
    // Remove from current WhatsApp campaign
    if (type === 'WhatsApp' && customer.whatsappCampaign === name) {
      customer.whatsappCampaign = '';
      customer.whatsappCampaignDate = '';
      customer.whatsappInterested = '';
      wasRemoved = true;
    }
    
    // Remove from current Telesales campaign
    if (type === 'Telesales' && customer.telesalesCampaign === name) {
      customer.telesalesCampaign = '';
      customer.telesalesCampaignDate = '';
      customer.telesalesInterested = '';
      wasRemoved = true;
    }
    
    // Remove from current Dashboard campaign
    if (type === 'Dashboard' && customer.dashboardCampaign === name) {
      customer.dashboardCampaign = '';
      customer.dashboardCampaignDate = '';
      customer.dashboardInterested = '';
      wasRemoved = true;
    }
    
    // Remove from campaign history
    if (customer.campaignHistory && customer.campaignHistory.length > 0) {
      const originalLength = customer.campaignHistory.length;
      customer.campaignHistory = customer.campaignHistory.filter(h => 
        !(h.type === type && h.name === name)
      );
      if (customer.campaignHistory.length < originalLength) {
        wasRemoved = true;
      }
    }
    
    if (wasRemoved) {
      removedCount++;
      updateLastCampaign(customer);
    }
  });
  
  logActivity('Deleted campaign: ' + type + ' - ' + name, removedCount + ' customers affected');
  saveData();
  render();
  toast('Campaign deleted from ' + removedCount + ' customers', 'success');
}

function deleteOrder(salesOrderId) {
  if (!salesOrderId) return;
  
  const order = S.orders.find(o => o.salesOrderId === salesOrderId);
  if (!order) return;
  
  const message = 'Are you sure you want to delete order "' + salesOrderId + '"?\n\nCustomer: ' + order.customerId + '\nProduct: ' + order.productType + ' - ' + order.productBrand + '\nAmount: $' + (parseFloat(order.sellingPrice) || 0).toLocaleString() + '\n\nThis action cannot be undone!';
  
  if (!confirm(message)) return;
  
  // Remove order from array
  const index = S.orders.findIndex(o => o.salesOrderId === salesOrderId);
  if (index !== -1) {
    S.orders.splice(index, 1);
    logActivity('Deleted order', salesOrderId);
    saveData();
    render();
    toast('Order deleted successfully', 'success');
  }
}

function saveOrder(isEdit) {
  const id = document.getElementById('m-salesOrderId').value.trim();
  const customerId = document.getElementById('m-customerId').value;
  const productType = document.getElementById('m-productType').value;
  const qty = document.getElementById('m-quantity').value;

  const price = document.getElementById('m-sellingPrice').value;
  
  if (!id || !customerId || !productType || !qty || !cost || !price) {
    toast('Please fill all required fields', 'error');
    return;
  }
  
  if (!isEdit && S.orders.find(o => o.salesOrderId === id)) {
    toast('Order ID already exists', 'error');
    return;
  }
  
  const orderData = {
    salesOrderId: id,
    customerId: customerId,
    productType: productType,
    productBrand: document.getElementById('m-productBrand').value.trim(),
    productDescription: document.getElementById('m-productDescription').value.trim(),
    quantity: parseInt(qty),

    salesPerson: document.getElementById('m-salesPerson').value.trim(),
    campaignName: document.getElementById('m-campaignName').value.trim(),
    campaignChannel: document.getElementById('m-campaignChannel').value,
    quotationId: '',
    creditDuration: '',
    vendor: '',
    quotationDate: '',
    salesOrderDate: new Date().toISOString().split('T')[0]
  };
  
  if (isEdit) {
    const idx = S.orders.findIndex(o => o.salesOrderId === id);

      S.orders[idx] = {...S.orders[idx], ...orderData};
      logActivity('Updated order', id);
      toast('Order updated!', 'success');

    S.orders.push(orderData);
    logActivity('Created order', id);
    toast('Order created!', 'success');
  }
  
  saveData();
  closeOrderModal();
  render();
}

function saveEdit() {
  const oldId = document.getElementById('edit-old-id').value;
  const c = S.customers.find(x => x.id === oldId);
  if (!c) return;
  
  const isAdmin = S.currentUser.id === 'admin' || S.currentUser.team === 'admin';
  
  // Check if Customer ID was changed (admin only)
  let newId = oldId;
  if (isAdmin) {
    const customerIdField = document.getElementById('edit-customer-id');
    if (customerIdField) {
      newId = customerIdField.value.trim();
      
      // Validate new ID is not empty
      if (!newId) {
        toast('Customer ID cannot be empty', 'error');
        return;
      }
      
      // Check if new ID already exists (and it's not the same customer)
      if (newId !== oldId) {
        const exists = S.customers.find(x => x.id === newId && x.id !== oldId);
        if (exists) {
          toast('Customer ID already exists! Please use a unique ID.', 'error');
          return;
        }
      }
    }
  }
  
  const company = document.getElementById('edit-company').value.trim();
  const pname = document.getElementById('edit-pname').value.trim();
  const pphone = document.getElementById('edit-pphone').value.trim();
  
  if (!company || !pname || !pphone) {
    toast('Company name, primary contact name and phone are required', 'error');
    return;
  }
  
  // If Customer ID changed, update it and all linked orders
  if (newId !== oldId) {
    c.id = newId;
    
    // Update all orders with this customer ID
    S.orders.forEach(o => {
      if (o.customerId === oldId) {
        o.customerId = newId;
      }
    });
    
    logActivity('Changed Customer ID from ' + oldId + ' to ' + newId, company);
  }
  
  c.companyName = company;
  c.city = document.getElementById('edit-city').value.trim();
  c.fleetSize = parseInt(document.getElementById('edit-fleet').value) || 0;
  c.fuelAM = document.getElementById('edit-fam').value.trim();
  c.ostoreAM = document.getElementById('edit-oam').value.trim();
  c.primaryContactName = pname;
  c.primaryContactPhone = pphone;
  c.secondaryContactName = document.getElementById('edit-sname').value.trim();
  c.secondaryContactPhone = document.getElementById('edit-sphone').value.trim();
  c.ostoreStatus = document.getElementById('edit-status').value;
  c.ostoreNote = document.getElementById('edit-note').value.trim();
  c.fuelActive = document.getElementById('edit-fuel-active').checked;
  c.ostoreActive = document.getElementById('edit-ostore-active').checked;
  c.onHitlist = document.getElementById('edit-hitlist').checked;
  
  // Initialize campaign history if it doesn't exist
  if (!c.campaignHistory) c.campaignHistory = [];
  
  // WhatsApp Campaign - Archive old one if changing
  const newWaCampaign = document.getElementById('edit-wa-camp').value.trim();
  const newWaDate = document.getElementById('edit-wa-date').value;
  const newWaInterest = document.getElementById('edit-wa-int').value;
  
  if (c.whatsappCampaign && (newWaCampaign !== c.whatsappCampaign || newWaDate !== c.whatsappCampaignDate)) {
    // Archive the old campaign
    c.campaignHistory.push({
      type: 'WhatsApp',
      name: c.whatsappCampaign,
      date: c.whatsappCampaignDate,
      interested: c.whatsappInterested,
      archivedAt: new Date().toISOString()
    });
  }
  c.whatsappCampaign = newWaCampaign;
  c.whatsappCampaignDate = newWaDate;
  c.whatsappInterested = newWaInterest;
  
  // Telesales Campaign - Archive old one if changing
  const newTsCampaign = document.getElementById('edit-ts-camp').value.trim();
  const newTsDate = document.getElementById('edit-ts-date').value;
  const newTsInterest = document.getElementById('edit-ts-int').value;
  
  if (c.telesalesCampaign && (newTsCampaign !== c.telesalesCampaign || newTsDate !== c.telesalesCampaignDate)) {
    c.campaignHistory.push({
      type: 'Telesales',
      name: c.telesalesCampaign,
      date: c.telesalesCampaignDate,
      interested: c.telesalesInterested,
      archivedAt: new Date().toISOString()
    });
  }
  c.telesalesCampaign = newTsCampaign;
  c.telesalesCampaignDate = newTsDate;
  c.telesalesInterested = newTsInterest;
  
  // Dashboard Campaign - Archive old one if changing
  const newDbCampaign = document.getElementById('edit-db-camp').value.trim();
  const newDbDate = document.getElementById('edit-db-date').value;
  const newDbInterest = document.getElementById('edit-db-int').value;
  
  if (c.dashboardCampaign && (newDbCampaign !== c.dashboardCampaign || newDbDate !== c.dashboardCampaignDate)) {
    c.campaignHistory.push({
      type: 'Dashboard',
      name: c.dashboardCampaign,
      date: c.dashboardCampaignDate,
      interested: c.dashboardInterested,
      archivedAt: new Date().toISOString()
    });
  }
  c.dashboardCampaign = newDbCampaign;
  c.dashboardCampaignDate = newDbDate;
  c.dashboardInterested = newDbInterest;
  
  if (c.ostoreActive) c.lastActivityOstore = new Date().toISOString();
  
  // Update last campaign tracking (automatic)
  updateLastCampaign(c);
  
  logActivity('Edited customer', c.companyName);
  saveData();
  closeModal();
  render();
  toast('Customer updated successfully', 'success');
}
