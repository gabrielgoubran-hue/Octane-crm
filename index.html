function handleCSV(file) {
  if (!file) return;
  
  // Get selected import mode
  const mode = document.querySelector('input[name="import-mode"]:checked')?.value || 'insert';
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim());
    
    if (lines.length < 2) {
      toast('CSV file is empty', 'error');
      return;
    }
    
    let inserted = 0;
    let updated = 0;
    let skipped = 0;
    
    for (let i = 1; i < lines.length; i++) {
      const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
      if (values.length < 4) continue;
      
      const customerId = values[0];
      
      // Check if customer already exists
      const existingIndex = S.customers.findIndex(c => c.id === customerId);
      const exists = existingIndex !== -1;
      
      // Handle based on mode
      if (mode === 'insert' && exists) {
        skipped++;
        continue; // Skip existing customers in insert-only mode
      }
      
      if (mode === 'update' && !exists) {
        skipped++;
        continue; // Skip new customers in update-only mode
      }
      
      // Build customer object
      const customerData = {
        id: customerId,
        companyName: values[1] || '',
        primaryContactName: values[2] || '',
        primaryContactPhone: values[3] || '',
        secondaryContactName: values[4] || '',
        secondaryContactPhone: values[5] || '',
        city: values[6] || '',
        fleetSize: parseInt(values[7]) || 0,
        fuelActive: values[8] === 'true' || values[8] === 'TRUE' || values[8] === '1',
        ostoreActive: values[9] === 'true' || values[9] === 'TRUE' || values[9] === '1',
        fuelAM: values[10] || '',
        ostoreAM: values[11] || '',
        onHitlist: values[12] === 'true' || values[12] === 'TRUE' || values[12] === '1',
        ostoreStatus: values[13] || '',
        ostoreNote: values[14] || '',
        lastActivityOstore: values[15] || '',
        whatsappCampaign: values[16] || '',
        whatsappCampaignDate: convertToISO(values[17]),
        whatsappInterested: values[18] || '',
        telesalesCampaign: values[19] || '',
        telesalesCampaignDate: convertToISO(values[20]),
        telesalesInterested: values[21] || '',
        dashboardCampaign: values[22] || '',
        dashboardCampaignDate: convertToISO(values[23]),
        dashboardInterested: values[24] || '',
        lastOutboundCampaign: '',
        lastOutboundEngagement: ''
      };
      
      // Validate required fields
      if (!customerData.id || !customerData.companyName || !customerData.primaryContactName || !customerData.primaryContactPhone) {
        skipped++;
        continue;
      }
      
      if (exists) {
        // UPDATE existing customer - preserve campaign history
        const existingCustomer = S.customers[existingIndex];
        
        // Initialize campaign history if needed
        if (!existingCustomer.campaignHistory) existingCustomer.campaignHistory = [];
        
        // Archive old WhatsApp campaign if changing
        if (existingCustomer.whatsappCampaign && 
            (customerData.whatsappCampaign !== existingCustomer.whatsappCampaign || 
             customerData.whatsappCampaignDate !== existingCustomer.whatsappCampaignDate)) {
          existingCustomer.campaignHistory.push({
            type: 'WhatsApp',
            name: existingCustomer.whatsappCampaign,
            date: existingCustomer.whatsappCampaignDate,
            interested: existingCustomer.whatsappInterested,
            archivedAt: new Date().toISOString()
          });
        }
        
        // Archive old Telesales campaign if changing
        if (existingCustomer.telesalesCampaign && 
            (customerData.telesalesCampaign !== existingCustomer.telesalesCampaign || 
             customerData.telesalesCampaignDate !== existingCustomer.telesalesCampaignDate)) {
          existingCustomer.campaignHistory.push({
            type: 'Telesales',
            name: existingCustomer.telesalesCampaign,
            date: existingCustomer.telesalesCampaignDate,
            interested: existingCustomer.telesalesInterested,
            archivedAt: new Date().toISOString()
          });
        }
        
        // Archive old Dashboard campaign if changing
        if (existingCustomer.dashboardCampaign && 
            (customerData.dashboardCampaign !== existingCustomer.dashboardCampaign || 
             customerData.dashboardCampaignDate !== existingCustomer.dashboardCampaignDate)) {
          existingCustomer.campaignHistory.push({
            type: 'Dashboard',
            name: existingCustomer.dashboardCampaign,
            date: existingCustomer.dashboardCampaignDate,
            interested: existingCustomer.dashboardInterested,
            archivedAt: new Date().toISOString()
          });
        }
        
        // Update with new data, preserving campaignHistory and createdAt
        S.customers[existingIndex] = {
          ...customerData,
          campaignHistory: existingCustomer.campaignHistory,
          createdAt: existingCustomer.createdAt
        };
        updated++;
        logActivity('Updated customer from CSV', customerData.companyName);
      } else {
        // INSERT new customer
        customerData.createdAt = new Date().toISOString();
        customerData.campaignHistory = [];
        S.customers.push(customerData);
        inserted++;
        logActivity('Imported customer from CSV', customerData.companyName);
      }
    }
    
    let message = '';
    if (inserted > 0) message += inserted + ' inserted';
    if (updated > 0) message += (message ? ', ' : '') + updated + ' updated';
    if (skipped > 0) message += (message ? ', ' : '') + skipped + ' skipped';
    
    if (inserted === 0 && updated === 0) {
      toast('No customers imported. Check your CSV format and import mode.', 'error');
    } else {
      saveData();
      toast('Import complete: ' + message, 'success');
      go('accounts');
    }
  };
  
  reader.readAsText(file);
}

function exportData() {
  if (S.customers.length === 0 && S.orders.length === 0) {
    toast('No data to export', 'error');
    return;
  }
  
  let filesExported = 0;
  
  // FILE 1: CUSTOMERS CSV
  if (S.customers.length > 0) {
    let csv = 'Customer ID,Company Name,Primary Contact,Primary Phone,Secondary Contact,Secondary Phone,City,Fleet Size,Fuel Active,O-store Active,Fuel AM,O-store AM,On Hitlist,Status,Note,Last Activity,WhatsApp Campaign,WhatsApp Date,WhatsApp Interest,Telesales Campaign,Telesales Date,Telesales Interest,Dashboard Campaign,Dashboard Date,Dashboard Interest,Created\n';
    
    S.customers.forEach(c => {
      csv += '"' + (c.id || '') + '",';
      csv += '"' + (c.companyName || '') + '",';
      csv += '"' + (c.primaryContactName || '') + '",';
      csv += '"' + (c.primaryContactPhone || '') + '",';
      csv += '"' + (c.secondaryContactName || '') + '",';
      csv += '"' + (c.secondaryContactPhone || '') + '",';
      csv += '"' + (c.city || '') + '",';
      csv += (c.fleetSize || 0) + ',';
      csv += (c.fuelActive ? 'Yes' : 'No') + ',';
      csv += (c.ostoreActive ? 'Yes' : 'No') + ',';
      csv += '"' + (c.fuelAM || '') + '",';
      csv += '"' + (c.ostoreAM || '') + '",';
      csv += (c.onHitlist ? 'Yes' : 'No') + ',';
      csv += '"' + (c.ostoreStatus || '') + '",';
      csv += '"' + (c.ostoreNote || '').replace(/"/g, '""') + '",';
      csv += '"' + (c.lastActivityOstore || '') + '",';
      csv += '"' + (c.whatsappCampaign || '') + '",';
      csv += '"' + convertToUS(c.whatsappDate || '') + '",';
      csv += '"' + (c.whatsappInterested || '') + '",';
      csv += '"' + (c.telesalesCampaign || '') + '",';
      csv += '"' + convertToUS(c.telesalesDate || '') + '",';
      csv += '"' + (c.telesalesInterested || '') + '",';
      csv += '"' + (c.dashboardCampaign || '') + '",';
      csv += '"' + convertToUS(c.dashboardDate || '') + '",';
      csv += '"' + (c.dashboardInterested || '') + '",';
      csv += '"' + (c.createdAt || '') + '"\n';
    });
    
    downloadCSV(csv, 'Octane_Customers_' + new Date().toISOString().split('T')[0] + '.csv');
    filesExported++;
  }
  
  // FILE 2: ORDERS CSV
  if (S.orders.length > 0) {
    let csv = 'Sales Order ID,Quotation ID,Customer ID,Customer Name,Product Type,Product Brand,Product Description,Quantity,Cost,Selling Price,Margin %,Payment Method,Credit Duration,Status,Vendor,Campaign Channel,Campaign Name,Sales Person,Quotation Date,Sales Order Date\n';
    
    S.orders.forEach(o => {
      const customer = S.customers.find(c => c.id === o.customerId);
      const margin = o.sellingPrice && o.cost ? Math.round(((o.sellingPrice - o.cost) / o.sellingPrice) * 100) : 0;
      
      csv += '"' + (o.salesOrderId || '') + '",';
      csv += '"' + (o.quotationId || '') + '",';
      csv += '"' + (o.customerId || '') + '",';
      csv += '"' + (customer ? customer.companyName : '') + '",';
      csv += '"' + (o.productType || '') + '",';
      csv += '"' + (o.productBrand || '') + '",';
      csv += '"' + (o.productDescription || '').replace(/"/g, '""') + '",';
      csv += (o.quantity || 0) + ',';
      csv += (o.cost || 0) + ',';
      csv += (o.sellingPrice || 0) + ',';
      csv += margin + ',';
      csv += '"' + (o.paymentMethod || '') + '",';
      csv += '"' + (o.creditDuration || '') + '",';
      csv += '"' + (o.status || '') + '",';
      csv += '"' + (o.vendor || '') + '",';
      csv += '"' + (o.campaignChannel || '') + '",';
      csv += '"' + (o.campaignName || '') + '",';
      csv += '"' + (o.salesPerson || '') + '",';
      csv += '"' + convertToUS(o.quotationDate || '') + '",';
      csv += '"' + convertToUS(o.salesOrderDate || '') + '"\n';
    });
    
    downloadCSV(csv, 'Octane_Orders_' + new Date().toISOString().split('T')[0] + '.csv');
    filesExported++;
  }
  
  // FILE 3: CAMPAIGNS CSV
  const campaignMap = {};
  
  S.customers.forEach(customer => {
    ['whatsapp', 'telesales', 'dashboard'].forEach(channel => {
      const campaignField = channel + 'Campaign';
      const interestedField = channel + 'Interested';
      
      const campName = customer[campaignField];
      if (campName) {
        const type = channel === 'whatsapp' ? 'WhatsApp' : channel === 'telesales' ? 'Telesales' : 'Dashboard';
        const key = type + '|' + campName;
        
        if (!campaignMap[key]) {
          campaignMap[key] = { type: type, name: campName, reach: 0, interested: 0, notInterested: 0, pending: 0 };
        }
        
        campaignMap[key].reach++;
        if (customer[interestedField] === 'Interested') campaignMap[key].interested++;
        else if (customer[interestedField] === 'Not interested') campaignMap[key].notInterested++;
        else if (customer[interestedField] === 'Pending') campaignMap[key].pending++;
      }
    });
  });
  
  const campaigns = Object.values(campaignMap);
  
  if (campaigns.length > 0) {
    let csv = 'Campaign Name,Type,Reach,Interested,Not Interested,Pending,Orders,Sales,Margin %,Success Rate %\n';
    
    campaigns.forEach(c => {
      const campaignOrders = S.orders.filter(o => {
        const orderChannel = (o.campaignChannel || '').trim().toLowerCase();
        const orderName = (o.campaignName || '').trim().toLowerCase();
        const campType = (c.type || '').trim().toLowerCase();
        const campName = (c.name || '').trim().toLowerCase();
        return orderChannel === campType && orderName === campName;
      });
      
      const revenue = campaignOrders.reduce((sum, o) => sum + (parseFloat(o.sellingPrice) || 0), 0);
      const cost = campaignOrders.reduce((sum, o) => sum + (parseFloat(o.cost) || 0), 0);
      const margin = revenue > 0 ? Math.round(((revenue - cost) / revenue) * 100) : 0;
      const successRate = c.reach > 0 ? Math.round((c.interested / c.reach) * 100) : 0;
      
      csv += '"' + c.name + '",';
      csv += '"' + c.type + '",';
      csv += c.reach + ',';
      csv += c.interested + ',';
      csv += c.notInterested + ',';
      csv += c.pending + ',';
      csv += campaignOrders.length + ',';
      csv += revenue + ',';
      csv += margin + ',';
      csv += successRate + '\n';
    });
    
    downloadCSV(csv, 'Octane_Campaigns_' + new Date().toISOString().split('T')[0] + '.csv');
    filesExported++;
  }
  
  logActivity('Exported ' + filesExported + ' CSV files (' + S.customers.length + ' customers, ' + S.orders.length + ' orders)', '');
  toast('Exported ' + filesExported + ' CSV files successfully!', 'success');
}

function downloadCSV(csvContent, fileName) {
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', fileName);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// Convert various date formats to YYYY-MM-DD for internal storage
function convertToISO(dateStr) {
  if (!dateStr) return '';
  
  // Remove any extra spaces
  dateStr = dateStr.trim();
  
  // Handle MM-DD-YYYY or M-D-YYYY (with dashes)
  if (dateStr.includes('-')) {
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      const month = parts[0].padStart(2, '0');
      const day = parts[1].padStart(2, '0');
      const year = parts[2];
      return year + '-' + month + '-' + day;
    }
  }
  
  // Handle MM/DD/YYYY or M/D/YYYY (with slashes)
  if (dateStr.includes('/')) {
    const parts = dateStr.split('/');
    if (parts.length === 3) {
      const month = parts[0].padStart(2, '0');
      const day = parts[1].padStart(2, '0');
      const year = parts[2];
      return year + '-' + month + '-' + day;
    }
  }
  
  // Already in YYYY-MM-DD format
  return dateStr;
}

// Convert YYYY-MM-DD to MM-DD-YYYY for display/export
function convertToUS(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length === 3 && parts[0].length === 4) {
    // YYYY-MM-DD to MM-DD-YYYY
    return parts[1] + '-' + parts[2] + '-' + parts[0];
  }
  return dateStr;
}

// Helper function to get orders for a campaign with flexible matching
function getCampaignOrders(campaign) {
  return S.orders.filter(o => {
    const orderChannel = (o.campaignChannel || '').trim().toLowerCase();
    const orderName = (o.campaignName || '').trim().toLowerCase();
    const campType = (campaign.type || '').trim().toLowerCase();
    const campName = (campaign.name || '').trim().toLowerCase();
    return orderChannel === campType && orderName === campName;
  });
}

// EXPORT HELPER: Export your data for sharing

function handleOrdersCSV(file) {
  if (!file) return;
  
  // Get selected import mode
  const mode = document.querySelector('input[name="orders-import-mode"]:checked')?.value || 'insert';
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim());
    
    if (lines.length < 2) {
      toast('CSV file is empty', 'error');
      return;
    }
    
    let inserted = 0;
    let updated = 0;
    let skipped = 0;
    
    for (let i = 1; i < lines.length; i++) {
      const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
      if (values.length < 15) continue;
      
      const salesOrderId = values[5];
      
      // Check if order already exists (using Sales Order ID as unique identifier)
      const existingIndex = S.orders.findIndex(o => o.salesOrderId === salesOrderId);
      const exists = existingIndex !== -1;
      
      // Handle based on mode
      if (mode === 'insert' && exists) {
        skipped++;
        continue; // Skip existing orders in insert-only mode
      }
      
      if (mode === 'update' && !exists) {
        skipped++;
        continue; // Skip new orders in update-only mode
      }
      
      // Helper function to parse numbers with commas
      const parseNumber = (str) => {
        if (!str) return 0;
        const cleaned = str.replace(/,/g, '');
        return parseFloat(cleaned) || 0;
      };
      
      const cost = parseNumber(values[14]);
      const sellingPrice = parseNumber(values[15]);
      const margin = values[16] ? parseNumber(values[16]) : (sellingPrice > 0 ? Math.round(((sellingPrice - cost) / sellingPrice) * 100) : 0);
      
      const order = {
        customerId: values[0],
        campaignChannel: values[1],
        campaignName: values[2],
        quotationId: values[3],
        quotationDate: convertToISO(values[4]),
        salesOrderId: salesOrderId,
        salesOrderDate: convertToISO(values[6]),
        productType: values[7],
        productBrand: values[8],
        productDescription: values[9],
        paymentMethod: values[10],
        quantity: parseInt(values[11]) || 0,
        vendor: values[12],
        status: values[13],
        cost: cost,
        sellingPrice: sellingPrice,
        margin: margin,
        creditDuration: values[17] || '',
        salesPerson: values[18] || ''
      };
      
      if (!order.customerId || !order.salesOrderId) {
        skipped++;
        continue;
      }
      
      if (exists) {
        // UPDATE existing order
        S.orders[existingIndex] = {
          ...order,
          createdAt: S.orders[existingIndex].createdAt
        };
        updated++;
        logActivity('Updated order from CSV', order.quotationId);
      } else {
        // INSERT new order
        order.createdAt = new Date().toISOString();
        S.orders.push(order);
        inserted++;
        logActivity('Imported order from CSV', order.quotationId);
      }
    }
    
    saveData();
    
    let message = '';
    if (inserted > 0) message += inserted + ' inserted';
    if (updated > 0) message += (message ? ', ' : '') + updated + ' updated';
    if (skipped > 0) message += (message ? ', ' : '') + skipped + ' skipped';
    
    if (inserted === 0 && updated === 0) {
      toast('No orders imported. Check your CSV format and import mode.', 'error');
    } else {
      toast('Import complete: ' + message, 'success');
      go('orders');
    }
  };
  
  reader.readAsText(file);
}
