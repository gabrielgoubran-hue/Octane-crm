<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octane CRM v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --oct:#e86510;--oct-l:#fff5ed;--oct-d:#c74d0a;
  --blue:#1565c0;--blue-l:#e3f2fd;
  --green:#16a34a;--green-l:#dcfce7;
  --red:#dc2626;--red-l:#fee;
  --bg:#f8f9fa;--surface:#fff;--surface2:#f5f5f5;
  --txt:#1a2332;--txt2:#64748b;--txt3:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;
  --r:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
.app{display:flex;height:100vh}
.sidebar{width:70px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:15px 0}
.logo{font-size:28px;margin-bottom:30px}
.nb{width:48px;height:48px;border:none;background:transparent;border-radius:12px;cursor:pointer;font-size:20px;margin-bottom:8px;transition:all .2s;position:relative;display:flex;align-items:center;justify-content:center}
.nb:hover{background:var(--oct-l)}
.nb.active{background:var(--oct);color:white}
.nb-sep{width:30px;height:1px;background:var(--border);margin:8px 0}
.content{flex:1;overflow-y:auto;padding:20px 30px}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;padding-bottom:15px;border-bottom:2px solid var(--oct)}
.ph-title{font-size:24px;font-weight:700;color:var(--txt)}
.ph-sub{font-size:13px;color:var(--txt2);margin-top:2px}
.ph-right{display:flex;gap:10px}
.btn{padding:10px 18px;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--oct);color:white}
.btn-primary:hover{background:var(--oct-d)}
.btn-secondary{background:var(--surface2);color:var(--txt)}
.btn-secondary:hover{background:var(--border2)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.stat{background:var(--surface);padding:15px;border-radius:var(--r);border:1px solid var(--border)}
.stat-lbl{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:28px;font-weight:700;color:var(--oct);margin-top:5px}
.stat-sub{font-size:11px;color:var(--txt3);margin-top:2px}
.fbar{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.fbar input{flex:1;min-width:250px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r);font-size:14px}
.fbar select{padding:10px 14px;border:1px solid var(--border);border-radius:var(--r);font-size:14px;background:white}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r);overflow:hidden}
.tbl thead{background:var(--surface2)}
.tbl th{text-align:left;padding:12px;font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border)}
.tbl td{padding:12px;border-bottom:1px solid var(--border)}
.tbl tbody tr{cursor:pointer;transition:background .2s}
.tbl tbody tr:hover{background:var(--oct-l)}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600}
.b-active{background:var(--green-l);color:var(--green)}
.b-inactive{background:var(--red-l);color:var(--red)}
.b-hitlist{background:#fef3c7;color:#d97706}
.expand-td{padding:0!important;background:var(--surface2)}
.expand-panel{padding:20px;border-top:1px solid var(--border)}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:15px}
.ep-field{margin-bottom:10px}
.ep-label{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.ep-val{font-size:14px;color:var(--txt)}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--surface);border-radius:12px;padding:25px;width:90%;max-width:700px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;color:var(--txt)}
.m-field{margin-bottom:15px}
.m-label{display:block;font-size:13px;font-weight:600;color:var(--txt);margin-bottom:5px}
.m-input,.m-select,.m-textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:14px;font-family:inherit}
.m-input:focus,.m-select:focus,.m-textarea:focus{outline:none;border-color:var(--oct)}
.m-textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.btn-cancel{flex:1;padding:12px;border:none;border-radius:var(--r);background:var(--surface2);color:var(--txt);font-weight:600;cursor:pointer}
.btn-confirm{flex:1;padding:12px;border:none;border-radius:var(--r);background:var(--oct);color:white;font-weight:600;cursor:pointer}
.btn-confirm:hover{background:var(--oct-d)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--txt);color:white;padding:12px 20px;border-radius:var(--r);opacity:0;transition:opacity .3s;z-index:2000}
.toast.show{opacity:1}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}
.section-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:15px}
.section-title{font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.required::after{content:' *';color:var(--red)}
.edit-btn{background:transparent;border:none;color:var(--oct);font-size:16px;cursor:pointer;padding:4px 8px}
.edit-btn:hover{background:var(--oct-l);border-radius:4px}
.empty{text-align:center;padding:40px;color:var(--txt3);font-style:italic}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:30px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover{border-color:var(--oct);background:var(--oct-l)}
.log-entry{padding:12px;border-bottom:1px solid var(--border);font-size:13px}
.log-time{color:var(--txt3);font-size:11px;margin-right:10px}
.log-user{color:var(--oct);font-weight:600;margin-right:5px}
.log-action{color:var(--txt2)}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="logo">⛽</div>
    <button class="nb active" id="nav-accounts" onclick="go('accounts')">📋</button>
    <button class="nb" id="nav-campaigns" onclick="go('campaigns')">📢</button>
    <button class="nb" id="nav-hitlist" onclick="go('hitlist')">🎯</button>
    <button class="nb" id="nav-logs" onclick="go('logs')">📜</button>
    <button class="nb" id="nav-import" onclick="go('import')">📥</button>
    <div class="nb-sep"></div>
    <button class="nb" onclick="exportData()">💾</button>
  </div>
  
  <div class="content" id="content"></div>
</div>

<div class="modal-bg" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modal-inner" onclick="event.stopPropagation()"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// STATE
const S = {
  page: 'accounts',
  customers: [],
  users: [{id: 'admin', name: 'Admin User', team: 'admin'}],
  activityLogs: [],
  expandedId: null,
  currentUser: {id: 'admin', name: 'Admin User'},
  fSearch: '',
  fStatus: ''
};

const STATUSES = ['Called','Answered','Not answered','Interested','Meeting scheduled','Meeting done','Offer sent','Offer accepted','Offer rejected'];

// INIT
function init() {
  loadData();
  render();
}

function loadData() {
  const saved = localStorage.getItem('octane_customers');
  if (saved) S.customers = JSON.parse(saved);
  
  const savedLogs = localStorage.getItem('octane_logs');
  if (savedLogs) S.activityLogs = JSON.parse(savedLogs);
  
  const savedUsers = localStorage.getItem('octane_users');
  if (savedUsers) S.users = JSON.parse(savedUsers);
}

function saveData() {
  localStorage.setItem('octane_customers', JSON.stringify(S.customers));
  localStorage.setItem('octane_logs', JSON.stringify(S.activityLogs));
  localStorage.setItem('octane_users', JSON.stringify(S.users));
}

function logActivity(action, customerName) {
  S.activityLogs.unshift({
    timestamp: new Date().toISOString(),
    user: S.currentUser.name,
    action: action,
    customerName: customerName
  });
  // Keep only last 500 logs
  if (S.activityLogs.length > 500) S.activityLogs = S.activityLogs.slice(0, 500);
  saveData();
}

function go(page) {
  S.page = page;
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  if (document.getElementById('nav-' + page)) {
    document.getElementById('nav-' + page).classList.add('active');
  }
  render();
}

function render() {
  const el = document.getElementById('content');
  if (S.page === 'accounts') el.innerHTML = renderAccounts();
  else if (S.page === 'campaigns') el.innerHTML = renderCampaigns();
  else if (S.page === 'hitlist') el.innerHTML = renderHitlist();
  else if (S.page === 'logs') el.innerHTML = renderLogs();
  else if (S.page === 'import') el.innerHTML = renderImport();
}

// ACCOUNTS PAGE
function renderAccounts() {
  const list = getVisible();
  const totalCustomers = S.customers.length;
  const activeCustomers = S.customers.filter(c => c.ostoreActive).length;
  const inactiveCustomers = totalCustomers - activeCustomers;
  const hitlistTotal = S.customers.filter(c => c.onHitlist).length;
  
  // Campaign stats
  const campaignOffers = S.customers.filter(c => 
    c.whatsappCampaign || c.telesalesCampaign || c.dashboardCampaign
  ).length;
  
  const leadsGenerated = S.customers.filter(c => 
    c.whatsappInterested === 'Interested' || 
    c.telesalesInterested === 'Interested' || 
    c.dashboardInterested === 'Interested'
  ).length;
  
  const convertedCustomers = S.customers.filter(c => 
    c.ostoreStatus === 'Offer accepted'
  ).length;
  
  const rows = list.map(c => {
    const isExp = S.expandedId === c.id;
    const lastCampaign = c.lastOutboundCampaign || '—';
    const interest = c.whatsappInterested || c.telesalesInterested || c.dashboardInterested || '—';
    
    let html = '<tr onclick="toggleExpand(\'' + c.id + '\')">';
    html += '<td><div style="font-weight:600;font-size:13px">' + c.companyName + '</div>';
    html += '<div style="font-size:11px;color:var(--txt3)">' + (c.primaryContactName || '') + '</div></td>';
    html += '<td style="font-size:12px;color:var(--txt2)">' + (c.city || '') + '</td>';
    html += '<td style="font-weight:600;color:var(--oct)">' + (c.fleetSize || 0) + '</td>';
    html += '<td><span class="badge ' + (c.fuelActive ? 'b-active' : 'b-inactive') + '">' + (c.fuelActive ? 'Active' : 'Inactive') + '</span></td>';
    html += '<td><span class="badge ' + (c.ostoreActive ? 'b-active' : 'b-inactive') + '">' + (c.ostoreActive ? 'Active' : 'Inactive') + '</span></td>';
    html += '<td>' + (c.ostoreStatus ? '<span class="badge">' + c.ostoreStatus + '</span>' : '—') + '</td>';
    html += '<td>' + (c.onHitlist ? '<span class="badge b-hitlist">✓ Hitlist</span>' : '') + '</td>';
    html += '<td style="font-size:11px;color:var(--txt2)">' + lastCampaign + '</td>';
    html += '<td style="font-size:11px;color:var(--txt2)">' + interest + '</td>';
    html += '<td><button class="edit-btn" onclick="event.stopPropagation();openEdit(\'' + c.id + '\')">✏️</button></td>';
    html += '</tr>';
    
    if (isExp) {
      html += '<tr><td colspan="10" class="expand-td"><div class="expand-panel">' + renderExpand(c) + '</div></td></tr>';
    }
    
    return html;
  }).join('');
  
  let html = '<div>';
  html += '<div class="page-head">';
  html += '<div><div class="ph-title">Accounts</div><div class="ph-sub">' + list.length + ' customers</div></div>';
  html += '<div class="ph-right">';
  html += '<button class="btn btn-primary" onclick="openAdd()">+ Add Customer</button>';
  html += '</div></div>';
  
  html += '<div class="stat-row">';
  html += '<div class="stat"><div class="stat-lbl">Total Customers</div><div class="stat-val" style="color:var(--oct)">' + totalCustomers + '</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Active O-store</div><div class="stat-val" style="color:var(--green)">' + activeCustomers + '</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Inactive O-store</div><div class="stat-val" style="color:var(--red)">' + inactiveCustomers + '</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Hitlist Total</div><div class="stat-val" style="color:#d97706">' + hitlistTotal + '</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Campaign Offers</div><div class="stat-val" style="color:var(--blue)">' + campaignOffers + '</div><div class="stat-sub">Total sent</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Leads Generated</div><div class="stat-val" style="color:var(--green)">' + leadsGenerated + '</div><div class="stat-sub">From campaigns</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Converted</div><div class="stat-val" style="color:var(--oct)">' + convertedCustomers + '</div><div class="stat-sub">Offer accepted</div></div>';
  html += '</div>';
  
  html += '<div class="fbar">';
  html += '<input type="text" placeholder="Search company, contact, city, phone…" value="' + S.fSearch + '" oninput="S.fSearch=this.value;render()">';
  html += '<select onchange="S.fStatus=this.value;render()"><option value="">All statuses</option>';
  STATUSES.forEach(s => {
    html += '<option value="' + s + '"' + (S.fStatus === s ? ' selected' : '') + '>' + s + '</option>';
  });
  html += '</select></div>';
  
  html += '<div class="tbl-wrap"><table class="tbl">';
  html += '<thead><tr><th>Company</th><th>City</th><th>Fleet Size</th><th>Fuel Activity</th><th>O-store Activity</th><th>Status</th><th>Hitlist</th><th>Last Campaign</th><th>Interest</th><th></th></tr></thead>';
  html += '<tbody>' + (rows || '<tr><td colspan="10"><div class="empty">No customers found</div></td></tr>') + '</tbody>';
  html += '</table></div></div>';
  
  return html;
}

function renderExpand(c) {
  let html = '<div class="ep-grid">';
  html += '<div class="ep-field"><div class="ep-label">Customer ID</div><div class="ep-val" style="font-weight:600;color:var(--oct)">' + c.id + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Primary Contact</div><div class="ep-val">' + (c.primaryContactName || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Primary Phone</div><div class="ep-val">' + (c.primaryContactPhone || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Secondary Contact</div><div class="ep-val">' + (c.secondaryContactName || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Secondary Phone</div><div class="ep-val">' + (c.secondaryContactPhone || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Fleet Size</div><div class="ep-val">' + (c.fleetSize || 0) + ' vehicles</div></div>';
  html += '<div class="ep-field"><div class="ep-label">Fuel AM</div><div class="ep-val">' + (c.fuelAM || '—') + '</div></div>';
  html += '<div class="ep-field"><div class="ep-label">O-store AM</div><div class="ep-val">' + (c.ostoreAM || '—') + '</div></div>';
  html += '</div>';
  
  if (c.ostoreNote) {
    html += '<div style="margin-top:15px;padding-top:15px;border-top:1px solid var(--border)">';
    html += '<div class="ep-label">O-store Note</div>';
    html += '<div style="font-size:13px;color:var(--txt2);margin-top:5px">' + c.ostoreNote + '</div>';
    html += '</div>';
  }
  
  // Campaign History
  if (c.campaignHistory && c.campaignHistory.length > 0) {
    html += '<div style="margin-top:15px;padding-top:15px;border-top:1px solid var(--border)">';
    html += '<div class="ep-label" style="margin-bottom:10px">📊 Campaign History (' + c.campaignHistory.length + ' past campaigns)</div>';
    html += '<div style="max-height:200px;overflow-y:auto">';
    
    // Sort by archived date (newest first)
    const sortedHistory = [...c.campaignHistory].sort((a, b) => 
      new Date(b.archivedAt) - new Date(a.archivedAt)
    );
    
    sortedHistory.forEach(campaign => {
      const typeColor = campaign.type === 'WhatsApp' ? '#0ea5e9' : 
                       campaign.type === 'Telesales' ? '#8b5cf6' : '#f59e0b';
      const interestColor = campaign.interested === 'Interested' ? 'var(--green)' : 
                           campaign.interested === 'Not Interested' ? 'var(--red)' : 
                           'var(--txt3)';
      
      html += '<div style="background:var(--surface2);padding:10px;margin-bottom:8px;border-radius:6px;border-left:3px solid ' + typeColor + '">';
      html += '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:4px">';
      html += '<div style="font-weight:600;font-size:13px;color:' + typeColor + '">' + campaign.type + '</div>';
      html += '<div style="font-size:11px;color:var(--txt3)">' + convertToUS(campaign.date || '') + '</div>';
      html += '</div>';
      html += '<div style="font-size:13px;margin-bottom:4px">' + campaign.name + '</div>';
      html += '<div style="font-size:11px;color:' + interestColor + ';font-weight:600">' + (campaign.interested || 'No response') + '</div>';
      html += '</div>';
    });
    
    html += '</div></div>';
  }
  
  return html;
}

function getVisible() {
  let list = S.customers;
  if (S.fSearch) {
    const q = S.fSearch.toLowerCase();
    list = list.filter(c => 
      c.companyName.toLowerCase().includes(q) ||
      (c.primaryContactName && c.primaryContactName.toLowerCase().includes(q)) ||
      (c.city && c.city.toLowerCase().includes(q)) ||
      (c.primaryContactPhone && c.primaryContactPhone.includes(q))
    );
  }
  if (S.fStatus) list = list.filter(c => c.ostoreStatus === S.fStatus);
  return list;
}

function toggleExpand(id) {
  S.expandedId = S.expandedId === id ? null : id;
  render();
}

// CAMPAIGNS PAGE
function renderCampaigns() {
  // Gather all campaigns from all customers
  const campaignMap = {};
  
  S.customers.forEach(customer => {
    // Current WhatsApp
    if (customer.whatsappCampaign) {
      const key = 'WhatsApp|' + customer.whatsappCampaign;
      if (!campaignMap[key]) {
        campaignMap[key] = {
          type: 'WhatsApp',
          name: customer.whatsappCampaign,
          dates: [],
          customers: [],
          interested: 0,
          notInterested: 0,
          pending: 0
        };
      }
      if (customer.whatsappCampaignDate && !campaignMap[key].dates.includes(customer.whatsappCampaignDate)) {
        campaignMap[key].dates.push(customer.whatsappCampaignDate);
      }
      campaignMap[key].customers.push(customer.companyName);
      if (customer.whatsappInterested === 'Interested') campaignMap[key].interested++;
      else if (customer.whatsappInterested === 'Not Interested') campaignMap[key].notInterested++;
      else if (customer.whatsappInterested === 'Pending') campaignMap[key].pending++;
    }
    
    // Current Telesales
    if (customer.telesalesCampaign) {
      const key = 'Telesales|' + customer.telesalesCampaign;
      if (!campaignMap[key]) {
        campaignMap[key] = {
          type: 'Telesales',
          name: customer.telesalesCampaign,
          dates: [],
          customers: [],
          interested: 0,
          notInterested: 0,
          pending: 0
        };
      }
      if (customer.telesalesCampaignDate && !campaignMap[key].dates.includes(customer.telesalesCampaignDate)) {
        campaignMap[key].dates.push(customer.telesalesCampaignDate);
      }
      campaignMap[key].customers.push(customer.companyName);
      if (customer.telesalesInterested === 'Interested') campaignMap[key].interested++;
      else if (customer.telesalesInterested === 'Not Interested') campaignMap[key].notInterested++;
      else if (customer.telesalesInterested === 'Pending') campaignMap[key].pending++;
    }
    
    // Current Dashboard
    if (customer.dashboardCampaign) {
      const key = 'Dashboard|' + customer.dashboardCampaign;
      if (!campaignMap[key]) {
        campaignMap[key] = {
          type: 'Dashboard',
          name: customer.dashboardCampaign,
          dates: [],
          customers: [],
          interested: 0,
          notInterested: 0,
          pending: 0
        };
      }
      if (customer.dashboardCampaignDate && !campaignMap[key].dates.includes(customer.dashboardCampaignDate)) {
        campaignMap[key].dates.push(customer.dashboardCampaignDate);
      }
      campaignMap[key].customers.push(customer.companyName);
      if (customer.dashboardInterested === 'Interested') campaignMap[key].interested++;
      else if (customer.dashboardInterested === 'Not Interested') campaignMap[key].notInterested++;
      else if (customer.dashboardInterested === 'Pending') campaignMap[key].pending++;
    }
    
    // Historical campaigns
    if (customer.campaignHistory) {
      customer.campaignHistory.forEach(hist => {
        const key = hist.type + '|' + hist.name + '|HISTORICAL';
        if (!campaignMap[key]) {
          campaignMap[key] = {
            type: hist.type,
            name: hist.name,
            dates: [],
            customers: [],
            interested: 0,
            notInterested: 0,
            pending: 0,
            isHistorical: true
          };
        }
        if (hist.date && !campaignMap[key].dates.includes(hist.date)) {
          campaignMap[key].dates.push(hist.date);
        }
        campaignMap[key].customers.push(customer.companyName);
        if (hist.interested === 'Interested') campaignMap[key].interested++;
        else if (hist.interested === 'Not Interested') campaignMap[key].notInterested++;
        else if (hist.interested === 'Pending') campaignMap[key].pending++;
      });
    }
  });
  
  // Convert to array and sort by name
  const campaigns = Object.values(campaignMap).sort((a, b) => {
    return a.name.localeCompare(b.name);
  });
  
  // Separate current and historical
  const currentCampaigns = campaigns.filter(c => !c.isHistorical);
  const historicalCampaigns = campaigns.filter(c => c.isHistorical);
  
  // Calculate totals
  const totalCampaigns = campaigns.length;
  const totalReach = campaigns.reduce((sum, c) => sum + c.customers.length, 0);
  const totalInterested = campaigns.reduce((sum, c) => sum + c.interested, 0);
  const totalNotInterested = campaigns.reduce((sum, c) => sum + c.notInterested, 0);
  const totalPending = campaigns.reduce((sum, c) => sum + c.pending, 0);
  
  let html = '<div>';
  html += '<div class="page-head">';
  html += '<div><div class="ph-title">📢 Campaigns</div><div class="ph-sub">' + totalCampaigns + ' total campaigns</div></div>';
  html += '</div>';
  
  // Stats
  html += '<div class="stat-row">';
  html += '<div class="stat"><div class="stat-lbl">Total Campaigns</div><div class="stat-val" style="color:var(--blue)">' + totalCampaigns + '</div><div class="stat-sub">' + currentCampaigns.length + ' active, ' + historicalCampaigns.length + ' historical</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Total Reach</div><div class="stat-val" style="color:var(--oct)">' + totalReach + '</div><div class="stat-sub">Customer contacts</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Interested</div><div class="stat-val" style="color:var(--green)">' + totalInterested + '</div><div class="stat-sub">' + (totalReach > 0 ? Math.round(totalInterested / totalReach * 100) : 0) + '% conversion</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Not Interested</div><div class="stat-val" style="color:var(--red)">' + totalNotInterested + '</div><div class="stat-sub">' + (totalReach > 0 ? Math.round(totalNotInterested / totalReach * 100) : 0) + '% rejected</div></div>';
  html += '<div class="stat"><div class="stat-lbl">Pending</div><div class="stat-val" style="color:var(--txt3)">' + totalPending + '</div><div class="stat-sub">' + (totalReach > 0 ? Math.round(totalPending / totalReach * 100) : 0) + '% awaiting</div></div>';
  html += '</div>';
  
  // Current Campaigns Section
  if (currentCampaigns.length > 0) {
    html += '<div style="margin-top:25px;margin-bottom:15px">';
    html += '<h3 style="font-size:18px;font-weight:700;color:var(--txt);margin-bottom:15px">🚀 Active Campaigns (' + currentCampaigns.length + ')</h3>';
    html += '<div class="tbl-wrap"><table class="tbl">';
    html += '<thead><tr><th>Campaign</th><th>Type</th><th>Date(s) Sent</th><th>Reach</th><th>Interested</th><th>Not Interested</th><th>Pending</th><th>Success Rate</th></tr></thead>';
    html += '<tbody>';
    
    currentCampaigns.forEach(c => {
      const typeColor = c.type === 'WhatsApp' ? '#0ea5e9' : c.type === 'Telesales' ? '#8b5cf6' : '#f59e0b';
      const typeIcon = c.type === 'WhatsApp' ? '💬' : c.type === 'Telesales' ? '📞' : '🎯';
      const total = c.customers.length;
      const successRate = total > 0 ? Math.round((c.interested / total) * 100) : 0;
      
      // Sort dates and format
      const sortedDates = c.dates.sort((a, b) => new Date(b) - new Date(a));
      const dateDisplay = sortedDates.length > 0 ? sortedDates.map(d => convertToUS(d)).join(', ') : '—';
      
      html += '<tr>';
      html += '<td><div style="font-weight:600;font-size:13px">' + c.name + '</div></td>';
      html += '<td><span style="color:' + typeColor + ';font-weight:600">' + typeIcon + ' ' + c.type + '</span></td>';
      html += '<td style="font-size:12px">' + dateDisplay + '</td>';
      html += '<td style="font-weight:600">' + total + '</td>';
      html += '<td><span style="color:var(--green);font-weight:600">' + c.interested + '</span></td>';
      html += '<td><span style="color:var(--red);font-weight:600">' + c.notInterested + '</span></td>';
      html += '<td><span style="color:var(--txt3);font-weight:600">' + c.pending + '</span></td>';
      html += '<td><div style="font-weight:700;font-size:14px;color:' + (successRate >= 50 ? 'var(--green)' : successRate >= 25 ? 'var(--oct)' : 'var(--red)') + '">' + successRate + '%</div></td>';
      html += '</tr>';
    });
    
    html += '</tbody></table></div></div>';
  }
  
  // Historical Campaigns Section
  if (historicalCampaigns.length > 0) {
    html += '<div style="margin-top:25px">';
    html += '<h3 style="font-size:18px;font-weight:700;color:var(--txt);margin-bottom:15px">📜 Historical Campaigns (' + historicalCampaigns.length + ')</h3>';
    html += '<div class="tbl-wrap"><table class="tbl">';
    html += '<thead><tr><th>Campaign</th><th>Type</th><th>Date(s) Sent</th><th>Reach</th><th>Interested</th><th>Not Interested</th><th>Pending</th><th>Success Rate</th></tr></thead>';
    html += '<tbody>';
    
    historicalCampaigns.forEach(c => {
      const typeColor = c.type === 'WhatsApp' ? '#0ea5e9' : c.type === 'Telesales' ? '#8b5cf6' : '#f59e0b';
      const typeIcon = c.type === 'WhatsApp' ? '💬' : c.type === 'Telesales' ? '📞' : '🎯';
      const total = c.customers.length;
      const successRate = total > 0 ? Math.round((c.interested / total) * 100) : 0;
      
      // Sort dates and format
      const sortedDates = c.dates.sort((a, b) => new Date(b) - new Date(a));
      const dateDisplay = sortedDates.length > 0 ? sortedDates.map(d => convertToUS(d)).join(', ') : '—';
      
      html += '<tr style="opacity:0.7">';
      html += '<td><div style="font-size:13px">' + c.name + '</div></td>';
      html += '<td><span style="color:' + typeColor + ';font-weight:600">' + typeIcon + ' ' + c.type + '</span></td>';
      html += '<td style="font-size:12px">' + dateDisplay + '</td>';
      html += '<td>' + total + '</td>';
      html += '<td><span style="color:var(--green)">' + c.interested + '</span></td>';
      html += '<td><span style="color:var(--red)">' + c.notInterested + '</span></td>';
      html += '<td><span style="color:var(--txt3)">' + c.pending + '</span></td>';
      html += '<td><div style="font-size:14px;color:' + (successRate >= 50 ? 'var(--green)' : successRate >= 25 ? 'var(--oct)' : 'var(--red)') + '">' + successRate + '%</div></td>';
      html += '</tr>';
    });
    
    html += '</tbody></table></div></div>';
  }
  
  if (totalCampaigns === 0) {
    html += '<div class="empty">No campaigns yet. Add campaigns to customers to see analytics here.</div>';
  }
  
  html += '</div>';
  return html;
}

function removeFromHitlist(id) {
  const c = S.customers.find(x => x.id === id);
  if (c) {
    c.onHitlist = false;
    logActivity('Removed from hitlist', c.companyName);
    saveData();
    render();
    toast('Removed from hit list', 'success');
  }
}

// LOGS PAGE

function addCustomer() {
  const customerId = document.getElementById('add-customer-id').value.trim();
  const company = document.getElementById('add-company').value.trim();
  const pname = document.getElementById('add-pname').value.trim();
  const pphone = document.getElementById('add-pphone').value.trim();
  
  if (!customerId) {
    toast('Customer ID is required', 'error');
    return;
  }
  
  // Check if customer ID already exists
  const exists = S.customers.find(c => c.id === customerId);
  if (exists) {
    toast('Customer ID already exists! Please use a unique ID.', 'error');
    return;
  }
  
  if (!company || !pname || !pphone) {
    toast('Company name, primary contact name and phone are required', 'error');
    return;
  }
  
  const customer = {
    id: customerId,
    companyName: company,
    city: document.getElementById('add-city').value.trim(),
    fleetSize: parseInt(document.getElementById('add-fleet').value) || 0,
    primaryContactName: pname,
    primaryContactPhone: pphone,
    secondaryContactName: '',
    secondaryContactPhone: '',
    fuelActive: false,
    ostoreActive: false,
    fuelAM: '',
    ostoreAM: '',
    onHitlist: false,
    ostoreStatus: '',
    ostoreNote: '',
    whatsappCampaign: '',
    whatsappCampaignDate: '',
    whatsappInterested: '',
    telesalesCampaign: '',
    telesalesCampaignDate: '',
    telesalesInterested: '',
    dashboardCampaign: '',
    dashboardCampaignDate: '',
    dashboardInterested: '',
    campaignHistory: [],
    lastOutboundCampaign: '',
    lastOutboundEngagement: '',
    lastActivityOstore: '',
    createdAt: new Date().toISOString()
  };
  
  S.customers.push(customer);
  logActivity('Created customer', company);
  saveData();
  closeModal();
  render();
  toast('Customer added successfully', 'success');
}

function saveEdit() {
  const id = document.getElementById('edit-id').value;
  const c = S.customers.find(x => x.id === id);
  if (!c) return;
  
  const company = document.getElementById('edit-company').value.trim();
  const pname = document.getElementById('edit-pname').value.trim();
  const pphone = document.getElementById('edit-pphone').value.trim();
  
  if (!company || !pname || !pphone) {
    toast('Company name, primary contact name and phone are required', 'error');
    return;
  }
  
  const changes = [];
  if (c.companyName !== company) changes.push('company name');
  
  c.companyName = company;
  c.city = document.getElementById('edit-city').value.trim();
  c.fleetSize = parseInt(document.getElementById('edit-fleet').value) || 0;
  c.fuelAM = document.getElementById('edit-fam').value.trim();
  c.ostoreAM = document.getElementById('edit-oam').value.trim();
  c.primaryContactName = pname;
  c.primaryContactPhone = pphone;
  c.secondaryContactName = document.getElementById('edit-sname').value.trim();
  c.secondaryContactPhone = document.getElementById('edit-sphone').value.trim();
  c.ostoreStatus = document.getElementById('edit-status').value;
  c.ostoreNote = document.getElementById('edit-note').value.trim();
  c.fuelActive = document.getElementById('edit-fuel-active').checked;
  c.ostoreActive = document.getElementById('edit-ostore-active').checked;
  c.onHitlist = document.getElementById('edit-hitlist').checked;
  
  // Initialize campaign history if it doesn't exist
  if (!c.campaignHistory) c.campaignHistory = [];
  
  // WhatsApp Campaign - Archive old one if changing
  const newWaCampaign = document.getElementById('edit-wa-camp').value.trim();
  const newWaDate = document.getElementById('edit-wa-date').value;
  const newWaInterest = document.getElementById('edit-wa-int').value;
  
  if (c.whatsappCampaign && (newWaCampaign !== c.whatsappCampaign || newWaDate !== c.whatsappCampaignDate)) {
    // Archive the old campaign
    c.campaignHistory.push({
      type: 'WhatsApp',
      name: c.whatsappCampaign,
      date: c.whatsappCampaignDate,
      interested: c.whatsappInterested,
      archivedAt: new Date().toISOString()
    });
  }
  c.whatsappCampaign = newWaCampaign;
  c.whatsappCampaignDate = newWaDate;
  c.whatsappInterested = newWaInterest;
  
  // Telesales Campaign - Archive old one if changing
  const newTsCampaign = document.getElementById('edit-ts-camp').value.trim();
  const newTsDate = document.getElementById('edit-ts-date').value;
  const newTsInterest = document.getElementById('edit-ts-int').value;
  
  if (c.telesalesCampaign && (newTsCampaign !== c.telesalesCampaign || newTsDate !== c.telesalesCampaignDate)) {
    c.campaignHistory.push({
      type: 'Telesales',
      name: c.telesalesCampaign,
      date: c.telesalesCampaignDate,
      interested: c.telesalesInterested,
      archivedAt: new Date().toISOString()
    });
  }
  c.telesalesCampaign = newTsCampaign;
  c.telesalesCampaignDate = newTsDate;
  c.telesalesInterested = newTsInterest;
  
  // Dashboard Campaign - Archive old one if changing
  const newDbCampaign = document.getElementById('edit-db-camp').value.trim();
  const newDbDate = document.getElementById('edit-db-date').value;
  const newDbInterest = document.getElementById('edit-db-int').value;
  
  if (c.dashboardCampaign && (newDbCampaign !== c.dashboardCampaign || newDbDate !== c.dashboardCampaignDate)) {
    c.campaignHistory.push({
      type: 'Dashboard',
      name: c.dashboardCampaign,
      date: c.dashboardCampaignDate,
      interested: c.dashboardInterested,
      archivedAt: new Date().toISOString()
    });
  }
  c.dashboardCampaign = newDbCampaign;
  c.dashboardCampaignDate = newDbDate;
  c.dashboardInterested = newDbInterest;
  
  if (c.ostoreActive) c.lastActivityOstore = new Date().toISOString();
  
  // Update last campaign tracking
  if (c.whatsappInterested && c.whatsappCampaign) {
    c.lastOutboundCampaign = 'WhatsApp: ' + c.whatsappCampaign;
    c.lastOutboundEngagement = new Date().toISOString();
  } else if (c.telesalesInterested && c.telesalesCampaign) {
    c.lastOutboundCampaign = 'Telesales: ' + c.telesalesCampaign;
    c.lastOutboundEngagement = new Date().toISOString();
  } else if (c.dashboardInterested && c.dashboardCampaign) {
    c.lastOutboundCampaign = 'Dashboard: ' + c.dashboardCampaign;
    c.lastOutboundEngagement = new Date().toISOString();
  }
  
  logActivity('Edited customer', c.companyName);
  saveData();
  closeModal();
  render();
  toast('Customer updated successfully', 'success');
}

function handleCSV(file) {
  if (!file) return;
  
  // Get selected import mode
  const mode = document.querySelector('input[name="import-mode"]:checked')?.value || 'insert';
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim());
    
    if (lines.length < 2) {
      toast('CSV file is empty', 'error');
      return;
    }
    
    let inserted = 0;
    let updated = 0;
    let skipped = 0;
    
    for (let i = 1; i < lines.length; i++) {
      const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
      if (values.length < 4) continue;
      
      const customerId = values[0];
      
      // Check if customer already exists
      const existingIndex = S.customers.findIndex(c => c.id === customerId);
      const exists = existingIndex !== -1;
      
      // Handle based on mode
      if (mode === 'insert' && exists) {
        skipped++;
        continue; // Skip existing customers in insert-only mode
      }
      
      if (mode === 'update' && !exists) {
        skipped++;
        continue; // Skip new customers in update-only mode
      }
      
      // Build customer object
      const customerData = {
        id: customerId,
        companyName: values[1] || '',
        primaryContactName: values[2] || '',
        primaryContactPhone: values[3] || '',
        secondaryContactName: values[4] || '',
        secondaryContactPhone: values[5] || '',
        city: values[6] || '',
        fleetSize: parseInt(values[7]) || 0,
        fuelActive: values[8] === 'true' || values[8] === 'TRUE' || values[8] === '1',
        ostoreActive: values[9] === 'true' || values[9] === 'TRUE' || values[9] === '1',
        fuelAM: values[10] || '',
        ostoreAM: values[11] || '',
        onHitlist: values[12] === 'true' || values[12] === 'TRUE' || values[12] === '1',
        ostoreStatus: values[13] || '',
        ostoreNote: values[14] || '',
        lastActivityOstore: values[15] || '',
        whatsappCampaign: values[16] || '',
        whatsappCampaignDate: convertToISO(values[17]),
        whatsappInterested: values[18] || '',
        telesalesCampaign: values[19] || '',
        telesalesCampaignDate: convertToISO(values[20]),
        telesalesInterested: values[21] || '',
        dashboardCampaign: values[22] || '',
        dashboardCampaignDate: convertToISO(values[23]),
        dashboardInterested: values[24] || '',
        lastOutboundCampaign: '',
        lastOutboundEngagement: ''
      };
      
      // Validate required fields
      if (!customerData.id || !customerData.companyName || !customerData.primaryContactName || !customerData.primaryContactPhone) {
        skipped++;
        continue;
      }
      
      if (exists) {
        // UPDATE existing customer - preserve campaign history
        const existingCustomer = S.customers[existingIndex];
        
        // Initialize campaign history if needed
        if (!existingCustomer.campaignHistory) existingCustomer.campaignHistory = [];
        
        // Archive old WhatsApp campaign if changing
        if (existingCustomer.whatsappCampaign && 
            (customerData.whatsappCampaign !== existingCustomer.whatsappCampaign || 
             customerData.whatsappCampaignDate !== existingCustomer.whatsappCampaignDate)) {
          existingCustomer.campaignHistory.push({
            type: 'WhatsApp',
            name: existingCustomer.whatsappCampaign,
            date: existingCustomer.whatsappCampaignDate,
            interested: existingCustomer.whatsappInterested,
            archivedAt: new Date().toISOString()
          });
        }
        
        // Archive old Telesales campaign if changing
        if (existingCustomer.telesalesCampaign && 
            (customerData.telesalesCampaign !== existingCustomer.telesalesCampaign || 
             customerData.telesalesCampaignDate !== existingCustomer.telesalesCampaignDate)) {
          existingCustomer.campaignHistory.push({
            type: 'Telesales',
            name: existingCustomer.telesalesCampaign,
            date: existingCustomer.telesalesCampaignDate,
            interested: existingCustomer.telesalesInterested,
            archivedAt: new Date().toISOString()
          });
        }
        
        // Archive old Dashboard campaign if changing
        if (existingCustomer.dashboardCampaign && 
            (customerData.dashboardCampaign !== existingCustomer.dashboardCampaign || 
             customerData.dashboardCampaignDate !== existingCustomer.dashboardCampaignDate)) {
          existingCustomer.campaignHistory.push({
            type: 'Dashboard',
            name: existingCustomer.dashboardCampaign,
            date: existingCustomer.dashboardCampaignDate,
            interested: existingCustomer.dashboardInterested,
            archivedAt: new Date().toISOString()
          });
        }
        
        // Update with new data, preserving campaignHistory and createdAt
        S.customers[existingIndex] = {
          ...customerData,
          campaignHistory: existingCustomer.campaignHistory,
          createdAt: existingCustomer.createdAt
        };
        updated++;
        logActivity('Updated customer from CSV', customerData.companyName);
      } else {
        // INSERT new customer
        customerData.createdAt = new Date().toISOString();
        customerData.campaignHistory = [];
        S.customers.push(customerData);
        inserted++;
        logActivity('Imported customer from CSV', customerData.companyName);
      }
    }
    
    let message = '';
    if (inserted > 0) message += inserted + ' inserted';
    if (updated > 0) message += (message ? ', ' : '') + updated + ' updated';
    if (skipped > 0) message += (message ? ', ' : '') + skipped + ' skipped';
    
    if (inserted === 0 && updated === 0) {
      toast('No customers imported. Check your CSV format and import mode.', 'error');
    } else {
      saveData();
      toast('Import complete: ' + message, 'success');
      go('accounts');
    }
  };
  
  reader.readAsText(file);
}

function exportData() {
  if (S.customers.length === 0) {
    toast('No customers to export', 'error');
    return;
  }
  
  let csv = 'Customer ID,Company Name,Primary Contact,Primary Phone,Secondary Contact,Secondary Phone,City,Fleet Size,Fuel Active,O-store Active,Fuel AM,O-store AM,On Hitlist,Status,Note,Last Activity O-store,WhatsApp Campaign,WhatsApp Campaign Date,WhatsApp Interest,Telesales Campaign,Telesales Campaign Date,Telesales Interest,Dashboard Campaign,Dashboard Campaign Date,Dashboard Interest,Last Campaign,Created\n';
  
  S.customers.forEach(c => {
    csv += '"' + c.id + '",';
    csv += '"' + c.companyName + '",';
    csv += '"' + (c.primaryContactName || '') + '",';
    csv += '"' + (c.primaryContactPhone || '') + '",';
    csv += '"' + (c.secondaryContactName || '') + '",';
    csv += '"' + (c.secondaryContactPhone || '') + '",';
    csv += '"' + (c.city || '') + '",';
    csv += c.fleetSize + ',';
    csv += (c.fuelActive ? 'TRUE' : 'FALSE') + ',';
    csv += (c.ostoreActive ? 'TRUE' : 'FALSE') + ',';
    csv += '"' + (c.fuelAM || '') + '",';
    csv += '"' + (c.ostoreAM || '') + '",';
    csv += (c.onHitlist ? 'TRUE' : 'FALSE') + ',';
    csv += '"' + (c.ostoreStatus || '') + '",';
    csv += '"' + (c.ostoreNote || '').replace(/"/g, '""') + '",';
    csv += '"' + (c.lastActivityOstore || '') + '",';
    csv += '"' + (c.whatsappCampaign || '') + '",';
    csv += '"' + convertToUS(c.whatsappCampaignDate || '') + '",';
    csv += '"' + (c.whatsappInterested || '') + '",';
    csv += '"' + (c.telesalesCampaign || '') + '",';
    csv += '"' + convertToUS(c.telesalesCampaignDate || '') + '",';
    csv += '"' + (c.telesalesInterested || '') + '",';
    csv += '"' + (c.dashboardCampaign || '') + '",';
    csv += '"' + convertToUS(c.dashboardCampaignDate || '') + '",';
    csv += '"' + (c.dashboardInterested || '') + '",';
    csv += '"' + (c.lastOutboundCampaign || '') + '",';
    csv += '"' + (c.createdAt || '') + '"\n';
  });
  
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'octane_customers_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  
  logActivity('Exported ' + S.customers.length + ' customers to CSV', '');
  toast('Exported ' + S.customers.length + ' customers', 'success');
}

// UTILITIES
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2);
}

// Convert MM-DD-YYYY to YYYY-MM-DD for internal storage
function convertToISO(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length === 3) {
    // MM-DD-YYYY to YYYY-MM-DD
    return parts[2] + '-' + parts[0] + '-' + parts[1];
  }
  return dateStr;
}

// Convert YYYY-MM-DD to MM-DD-YYYY for display/export
function convertToUS(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length === 3 && parts[0].length === 4) {
    // YYYY-MM-DD to MM-DD-YYYY
    return parts[1] + '-' + parts[2] + '-' + parts[0];
  }
  return dateStr;
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').style.display = 'none';
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.className = 'toast', 2800);
}
